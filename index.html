    const streamRef = useRef(null);
    const timerRef = useRef(null);
    const doneRef = useRef(false);

    const stopCamera = () => {
      if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; }
      if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
    };

    const lookup = async (code) => {
      setBusy(true); setMsg("Looking up " + code + "…");
      try {
        const food = await (lookupFn || lookupOpenFoodFacts)(code);
        if (food) { stopCamera(); onFound(food); }
        else { setStatus("notfound"); setMsg("No product found for " + code + "."); setBusy(false); doneRef.current = false; }
      } catch (e) {
        setStatus("error"); setMsg("Lookup failed — check your connection."); setBusy(false); doneRef.current = false;
      }
    };

    useEffect(() => {
      if (!supported) return;
      let cancelled = false;
      (async () => {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setStatus("nocam"); return; }
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
          if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
          streamRef.current = stream;
          const v = videoRef.current;
          if (v) { v.srcObject = stream; v.setAttribute("playsinline", "true"); try { await v.play(); } catch (e) {} }
          const detector = new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128"] });
          setStatus("scanning"); setMsg("Point the camera at a barcode");

              const codes = await detector.detect(videoRef.current);
              if (codes && codes.length && codes[0].rawValue) {
                doneRef.current = true;
                if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; }
                lookup(codes[0].rawValue);
              }
            } catch (e) {}
          }, 350);
        } catch (e) {
          setStatus((e && (e.name === "NotAllowedError" || e.name === "SecurityError")) ? "denied" : "nocam");
        }

    const noteFor = {
      denied: "Camera permission was denied. Enter the barcode number below instead.",
      nocam: "No camera available here. Enter the barcode number below instead.",
      unsupported: "Live scanning isn't supported in this browser (e.g. iOS Safari). Enter the barcode number below — it still looks up Open Food Facts.",
      notfound: msg, error: msg
    };

    return h("div", null,
      supported && (status === "starting" || status === "scanning") && h("div", {
        style: { position: "relative", borderRadius: 12, overflow: "hidden", background: "#000", aspectRatio: "3/4", marginBottom: 12 }
      },
        h("video", { ref: videoRef, muted: true, playsInline: true, style: { width: "100%", height: "100%", objectFit: "cover" } }),
        h("div", { style: { position: "absolute", left: "10%", right: "10%", top: "38%", bottom: "38%", border: "2px solid rgba(255,255,255,0.85)", borderRadius: 10, boxShadow: "0 0 0 100vmax rgba(0,0,0,0.25)" } })
      ),
      busy && h("div", { style: { padding: 10, textAlign: "center", color: "var(--muted)" } }, msg),
      !busy && supported && status === "scanning" && h("div", { style: { fontSize: 12.5, color: "var(--muted)", textAlign: "center", marginBottom: 10 } }, msg),
      !busy && noteFor[status] && h("div", {
        style: { fontSize: 12.5, color: status === "error" ? "var(--danger)" : "var(--muted)", marginBottom: 12, textAlign: "center" }
      }, noteFor[status]),
      h("div", { className: "field" },
        h("label", null, "Barcode number"),
        h("input", { className: "input", type: "number", inputMode: "numeric", placeholder: "e.g. 5000159407236", value: manual, onChange: (e) => setManual(e.target.value) })
      ),
      h("button", { className: "btn", disabled: busy || !manual.trim(), onClick: submitManual }, busy ? "Looking up…" : "Look up barcode"),
      h("div", { style: { fontSize: 11, color: "var(--muted)", marginTop: 10, textAlign: "center" } }, footnote || "Product data from Open Food Facts · needs an internet connection.")

    ["vitE", "Vitamin E", "mg"], ["vitK", "Vitamin K", "µg"], ["folate", "Folate", "µg DFE"], ["b12", "Vitamin B12", "µg"],
    ["ala", "Omega-3 ALA", "g"], ["epa", "EPA", "mg"], ["dha", "DHA", "mg"]
  ];
  function ManualFoodEntry({ onAdd }) {
    // Nutrition is entered per 100g/100ml (a fixed, reusable basis) plus the weight of the portion
    // actually being logged today — macros for that portion are derived automatically, and the
    // per-100g values can be saved straight into the food database for next time.
    const [v, setV] = useState({
      name: "", grams: 100, calories: 0, protein: 0, carbs: 0, fat: 0, fiber: "", sugar: "", sodium: ""
    });
    const [saveForFuture, setSaveForFuture] = useState(true);
    const [more, setMore] = useState({});          // optional extra nutrients, same basis as the main fields
    const [showMore, setShowMore] = useState(false);
    const [basisG, setBasisG] = useState(100);      // label basis: values are per 100 g, or per a serving of N g
    const onN = (k) => (e) => setV(s => ({ ...s, [k]: e.target.value === "" ? "" : Number(e.target.value) }));
    const valid = v.name.trim().length > 0 && Number(v.grams) > 0 && Number(basisG) > 0;
    // Blank fiber / sugar / sodium etc. = unknown (kept as null so averages aren't dragged down).
    // Entered values are converted to per-100 g whatever basis the label uses.
    const fct = 100 / (Number(basisG) || 100);
    const conv = (x) => { const n = numOrNull(x); return n === null ? null : Math.round(n * fct * 1000) / 1000; };
    const per100 = { g: 100, calories: (Number(v.calories)||0) * fct, protein: (Number(v.protein)||0) * fct, carbs: (Number(v.carbs)||0) * fct,
      fat: (Number(v.fat)||0) * fct, fiber: conv(v.fiber), sugar: conv(v.sugar), sodium: conv(v.sodium), micros: {} };
    MANUAL_MORE.forEach(([k]) => {
      const val = conv(more[k]);
      if (val === null) return;
      if (NUTRIENT_KEYS.indexOf(k) >= 0) per100[k] = val; else per100.micros[k] = val;
    });
    const portion = scaleFoodToWeight(per100, Number(v.grams) || 0);

    const submit = () => {
      const scaled = scaleFoodToWeight(per100, Number(v.grams) || 0);
      const foodForDb = saveForFuture
        ? { name: v.name.trim(), serving: "100g", g: 100, ...nutritionOf(per100), src: "custom",
            units: Number(basisG) !== 100 ? [{ label: "1 serving", g: Number(basisG) }] : [] }
        : null;
      onAdd({
        id: "manual-" + uid(), name: v.name.trim(), serving: v.grams + "g", grams: Number(v.grams) || 0,
        baseGrams: 100, baseNutrition: nutritionOf(per100),
        ...scaled
      }, foodForDb);
    };

    return h("div", null,
      h("div", { className: "field" },
        h("label", null, "Name"),
        h("input", { className: "input", value: v.name, onChange: (e) => setV(s => ({ ...s, name: e.target.value })), placeholder: "e.g. Mom's biryani" })
      ),
      h("div", { style: { display: "flex", alignItems: "center", gap: 8, margin: "-2px 0 10px", flexWrap: "wrap" } },
        h("span", { style: { fontSize: 12, color: "var(--muted)" } }, "Values below are per"),
        h("select", { className: "select", style: { width: "auto", padding: "6px 8px" }, value: Number(basisG) === 100 ? "100" : "serving",
          onChange: (e) => setBasisG(e.target.value === "100" ? 100 : 30), "aria-label": "Label basis" },
          h("option", { value: "100" }, "100 g / ml"), h("option", { value: "serving" }, "serving of…")),
        Number(basisG) !== 100 || basisG === "" ? h("input", { className: "input", type: "number", style: { width: 80, padding: "6px 8px" }, value: basisG,
          "aria-label": "Serving size in grams", onChange: (e) => setBasisG(e.target.value === "" ? "" : Number(e.target.value)) }) : null,
        Number(basisG) !== 100 || basisG === "" ? h("span", { style: { fontSize: 12, color: "var(--muted)" } }, "g") : null),
      h("div", { className: "field-row3" },
        h("div", null, h("label", null, "Calories"),
          h("input", { className: "input", type: "number", value: v.calories, onChange: onN("calories") })),
        h("div", null, h("label", null, "Protein (g)"),
          h("input", { className: "input", type: "number", step: "0.1", value: v.protein, onChange: onN("protein") })),
        h("div", null, h("label", null, "Carbs (g)"),
          h("input", { className: "input", type: "number", step: "0.1", value: v.carbs, onChange: onN("carbs") }))
      ),
      h("div", { className: "field-row3", style: { marginTop: 8 } },
        h("div", null, h("label", null, "Fat (g)"),
          h("input", { className: "input", type: "number", step: "0.1", value: v.fat, onChange: onN("fat") })),
        h("div", null, h("label", null, "Fiber (g)"),
          h("input", { className: "input", type: "number", step: "0.1", value: v.fiber, placeholder: "unknown", onChange: onN("fiber") })),
        h("div", null, h("label", null, "Sugar (g)"),
          h("input", { className: "input", type: "number", step: "0.1", value: v.sugar, placeholder: "unknown", onChange: onN("sugar") }))
      ),
      h("div", { className: "field", style: { marginTop: 8 } },
        h("label", null, "Sodium (mg)"),
        h("input", { className: "input", type: "number", value: v.sodium, placeholder: "unknown", onChange: onN("sodium") })
      ),
      !showMore
        ? h("button", { className: "btn secondary", style: { marginTop: 4 }, onClick: () => setShowMore(true) }, "More nutrients from the label (optional)")
        : h("div", { style: { marginTop: 6 } },

                h("label", null, label + " (" + unit + ")"),

                  onChange: (e) => setMore(m => ({ ...m, [k]: e.target.value })) }))))),
      h("hr", { className: "sep" }),
      h("div", { className: "field" },
        h("label", null, "Weight of the portion you're logging (g)"),

      ),

        h("div", { style: { fontSize: 12.5, color: "var(--muted)", marginTop: 3 } },

      ),

        h("input", { type: "checkbox", checked: saveForFuture, onChange: (e) => setSaveForFuture(e.target.checked), style: { width: 16, height: 16 } }),
        h("span", { style: { fontSize: 12.5, color: "var(--text)" } }, "Save this dish to my food database for future use")
      ),
      h("div", { className: "btn-row", style: { marginTop: 10 } },
        h("button", { className: "btn", disabled: !valid, onClick: submit }, "Add to meal")
      )
    );
  }

  /* ---------- Workouts ---------- */
  function WorkoutsTab({ data, setData, activeDate, setActiveDate, openAddWorkout }) {
    const day = data.days[activeDate] || { workouts: [] };
    const burn = dayBurn(day);
    const wOut = day.workouts || [];
    const [template, setTemplate] = useState(null);

    const updateWorkout = (id, patch) => {
      const next = { ...data };
      const d = ensureDay(next.days, activeDate);
      d.workouts = d.workouts.map(w => {
        if (w.id !== id) return w;
        const merged = { ...w, ...patch };
        if (merged.type === "strength") merged.calories = strengthCalories(merged, next.profile.weightKg);
        else merged.calories = cardioCalories(merged, next.profile.weightKg);
        return merged;
      });
      setData(next);
    };
    const removeWorkout = (id) => {
      const next = { ...data };
      const d = ensureDay(next.days, activeDate);
      d.workouts = d.workouts.filter(w => w.id !== id);
      setData(next);
    };
    const toggleUnit = (name) => {
      const cur = (data.exerciseUnits || {})[name] || "kg";
      setData({ ...data, exerciseUnits: { ...(data.exerciseUnits || {}), [name]: cur === "lbs" ? "kg" : "lbs" } });
    };
    const setExerciseType = (name, type) => {
      setData({ ...data, exerciseTypes: { ...(data.exerciseTypes || {}), [name]: type } });
    };
    // Supersets are a non-destructive tag: exercises sharing a supersetId render grouped.
    const groupWithAbove = (id) => {
      const next = { ...data };
      const d = ensureDay(next.days, activeDate);
      const arr = d.workouts || [];
      const idx = arr.findIndex(x => x.id === id);
      if (idx <= 0) return;
      const cur = arr[idx], prev = arr[idx - 1];
      if (!cur || !prev || cur.type !== "strength" || prev.type !== "strength") return;
      const gid = prev.supersetId || ("ss-" + uid());
      d.workouts = arr.map((x, i) => {
        if (i === idx) return { ...x, supersetId: gid };
        if (i === idx - 1 && !prev.supersetId) return { ...x, supersetId: gid };
        return x;
      });
      setData(next);
    };
    const ungroup = (id) => {
      const next = { ...data };
      const d = ensureDay(next.days, activeDate);
      const strip = (x) => { const c = { ...x }; delete c.supersetId; return c; };
      let arr = (d.workouts || []).map(x => x.id === id ? strip(x) : x);
      const counts = {};
      arr.forEach(x => { if (x.supersetId) counts[x.supersetId] = (counts[x.supersetId] || 0) + 1; });
      arr = arr.map(x => (x.supersetId && counts[x.supersetId] < 2) ? strip(x) : x);
      d.workouts = arr;
      setData(next);
    };
    const [plateFor, setPlateFor] = useState(null); // { weight, unit }
    const [detailsFor, setDetailsFor] = useState(null); // exercise name

    const strengthWorkouts = wOut.filter(w => w.type === "strength");
    const sessionTotals = strengthWorkouts.reduce((s, w) => {
      const t = exerciseTotals(w);
      return { weight: s.weight + t.totalWeight, reps: s.reps + t.totalReps, sets: s.sets + (w.sets||[]).length };
    }, { weight: 0, reps: 0, sets: 0 });
    const muscleChips = [...new Set(strengthWorkouts.map(w => (findExerciseMeta(w.name, data.customExercises)||{}).category).filter(Boolean))];
    const templates = templatesForGoal(data.profile.goal);

    return h("div", null,
      h("div", { className: "header" },
        h("div", null,
          h("h1", null, "Workouts"),
          h("div", { className: "sub" }, wOut.length + " session" + (wOut.length !== 1 ? "s" : "") + " · " + burn + " kcal burned")
        )
      ),
      h("div", { className: "date-nav" },
        h("button", { className: "nav-btn", onClick: () => setActiveDate(shift(activeDate, -1)) }, Icon("chevronL", 18)),
        h("div", { className: "date" }, fmtDate(activeDate)),
        h("button", { className: "nav-btn", onClick: () => setActiveDate(shift(activeDate, 1)), disabled: activeDate >= todayKey() }, Icon("chevron", 18))
      ),

      // Quick-start templates
      h("div", { className: "card" },
        h("h2", null, "Quick start · suggested for you"),
        h("div", { className: "template-scroll" },
          templates.map(t => h("div", { key: t.id, className: "template-card", onClick: () => setTemplate(t) },
            h("div", { className: "emoji" }, t.emoji),
            h("div", { className: "nm" }, t.name),
            h("div", { className: "meta" }, t.exercises.length + " exercises"),
            t.recommended && h("div", { className: "badge-rec" }, "For your goal")
          ))
        )
      ),

      wOut.length > 0 && h("div", { className: "session-summary" },
        h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
          h("div", { style: { fontWeight: 600, fontSize: 13.5 } }, "Today's session summary"),
          h("div", { style: { fontSize: 13, fontWeight: 700, color: "var(--primary)" } }, burn + " kcal")
        ),
        h("div", { className: "totals-row" },
          h("div", { className: "t-cell" }, h("div", { className: "v" }, (sessionTotals.weight/1000).toFixed(2) + "t"), h("div", { className: "l" }, "Total weight")),
          h("div", { className: "t-cell" }, h("div", { className: "v" }, sessionTotals.sets), h("div", { className: "l" }, "Total sets")),
          h("div", { className: "t-cell" }, h("div", { className: "v" }, sessionTotals.reps), h("div", { className: "l" }, "Total reps"))
        ),
        muscleChips.length > 0 && h("div", { className: "chips" },
          muscleChips.map(c => h("span", { key: c, className: "muscle-chip", style: { background: MUSCLE_SOFT[c], color: MUSCLE_COLORS[c] } }, c))
        )
      ),

      wOut.length === 0 ? h("div", { className: "card empty-state" },
        h("div", { className: "ic" }, "💪"),
        h("div", { className: "t" }, "No workouts logged"),
        h("div", { className: "s" }, "Tap the + button, or pick a quick-start template above")
      ) : null,
      (() => {
        const out = [];
        const renderStrength = (w, idx, ssLabel) => h(StrengthCard, {
          key: w.id, w, prs: data.prs || {}, allDays: data.days, customExercises: data.customExercises,
          exerciseTypes: data.exerciseTypes, onSetType: (t) => setExerciseType(w.name, t),
          onOpenPlateCalc: (weight, unit) => setPlateFor({ weight, unit }),
          onOpenDetails: (nm) => setDetailsFor(nm), cues: (data.exerciseNotes || {})[w.name],
          unit: (data.exerciseUnits || {})[w.name] || "kg", onToggleUnit: () => toggleUnit(w.name),
          onChange: (p) => updateWorkout(w.id, p), onRemove: () => removeWorkout(w.id),
          canGroupAbove: idx > 0 && wOut[idx - 1] && wOut[idx - 1].type === "strength" && !w.supersetId,
          onGroupAbove: () => groupWithAbove(w.id),
          inSuperset: !!ssLabel, ssLabel, onUngroup: () => ungroup(w.id)
        });
        let i = 0;
        while (i < wOut.length) {
          const w = wOut[i];
          if (w.type === "strength" && w.supersetId) {
            const gid = w.supersetId; const group = [w]; let j = i + 1;
            while (j < wOut.length && wOut[j].type === "strength" && wOut[j].supersetId === gid) { group.push(wOut[j]); j++; }
            if (group.length > 1) {
              out.push(h("div", { key: "grp-" + gid, className: "superset-group" },
                h("div", { className: "superset-head" }, "⛓ Superset · " + group.length + " exercises · back-to-back"),
                group.map((gw, gi) => renderStrength(gw, wOut.indexOf(gw), String(gi + 1)))
              ));
              i = j; continue;
            }
          }
          out.push(w.type === "strength"
            ? renderStrength(w, i, null)
            : h(CardioCard, { key: w.id, w, onChange: (p) => updateWorkout(w.id, p), onRemove: () => removeWorkout(w.id) }));
          i++;
        }
        return out;
      })(),
      h(TemplatePreviewSheet, { open: !!template, onClose: () => setTemplate(null), template, data, setData, activeDate }),
      h(PlateCalcSheet, { open: !!plateFor, onClose: () => setPlateFor(null), target: plateFor }),
      h(ExerciseDetailsSheet, { open: !!detailsFor, onClose: () => setDetailsFor(null), name: detailsFor, data, setData })
    );
  }

  function isPR(exercise, weight, reps, days, currentWorkoutId) {
    if (!weight || !reps) return false;
    let max = 0;
    for (const dayKey in days) {
      const ws = days[dayKey].workouts || [];
      for (const w of ws) {
        if (w.type !== "strength" || w.name !== exercise || w.id === currentWorkoutId) continue;
        for (const s of (w.sets || [])) {
          if (s.weight && s.reps && s.weight * s.reps > max) max = s.weight * s.reps;
        }
      }
    }
    return weight * reps > max;
  }

  // A single timed set: live stopwatch + manual MM:SS entry. On Stop, elapsed time is added to the set.
  // When showWeight is true (weighted-timed exercises, e.g. loaded carries) it also renders a weight field.
  function TimedSetRow({ index, set, onChange, onRemove, showWeight, unit, shownWeight, onWeightInput }) {
    const [running, setRunning] = useState(false);
    const [, setNowTs] = useState(0);
    const startRef = useRef(0);
    const timerRef = useRef(null);
    useEffect(() => () => { if (timerRef.current) clearInterval(timerRef.current); }, []);
    const base = Math.max(0, Math.round(Number(set.durationSec) || 0));
    const runningSec = running ? Math.max(0, Math.floor((Date.now() - startRef.current) / 1000)) : 0;
    const start = () => {
      startRef.current = Date.now();
      setRunning(true);
      timerRef.current = setInterval(() => setNowTs(Date.now()), 250);
    };
    const stop = () => {
      if (timerRef.current) clearInterval(timerRef.current);
      timerRef.current = null;
      const added = Math.max(0, Math.floor((Date.now() - startRef.current) / 1000));
      setRunning(false);
      onChange({ durationSec: base + added });
    };
    const mm = Math.floor(base / 60), ss = base % 60;
    return h("div", { className: "set-row timed" + (showWeight ? " wtimed" : "") },
      h("div", { className: "n" }, index + 1),
      showWeight && h("div", { className: "wt-input" },
        h("input", { type: "number", inputMode: "decimal", placeholder: unit || "kg", value: shownWeight, onChange: (e) => onWeightInput(e.target.value) })
      ),
      h("div", { className: "clock" + (running ? " live" : "") }, fmtDuration(base + runningSec)),
      running
        ? h("div", { className: "dur-input", style: { color: "var(--muted)", fontSize: 12 } }, "recording…")
        : h("div", { className: "dur-input" },
            h("input", { type: "number", inputMode: "numeric", min: 0, placeholder: "min", value: mm || "", onChange: (e) => onChange({ durationSec: parseDuration(e.target.value, ss) }) }),
            h("span", null, ":"),
            h("input", { type: "number", inputMode: "numeric", min: 0, max: 59, placeholder: "sec", value: ss || "", onChange: (e) => onChange({ durationSec: parseDuration(mm, e.target.value) }) })
          ),
      h("button", { className: "stopwatch-btn" + (running ? " running" : ""), onClick: running ? stop : start }, running ? "■ Stop" : "▶ Start"),
      h("button", { className: "icon-btn-sm danger", onClick: onRemove }, Icon("close", 16))
    );
  }

      setSets(m.sets || 3);
      setReps(m.reps || 10);

      const next = { ...data };

                  : h("input", { className: "input", type: "number", inputMode: "numeric", value: sets, onChange: (e) => setSets(e.target.value) })),
        h("div", null, h("label", null, "Default reps"),

  /* ---------- Add Workout Sheet ---------- */
  function AddWorkoutSheet({ open, onClose, data, setData, activeDate }) {
    const [type, setType] = useState("strength");
    const [name, setName] = useState("");
    const [browsing, setBrowsing] = useState(false);
    const [cat, setCat] = useState("All");
    const [suggestion, setSuggestion] = useState(null);
    const [minutes, setMinutes] = useState(30);
    const [distance, setDistance] = useState("");
    const [met, setMet] = useState(7);
    const [machine, setMachine] = useState("other");
    const [machineParams, setMachineParams] = useState({});
    const [newCat, setNewCat] = useState("Full Body");
    const [newType, setNewType] = useState(""); // "" = auto-detect from name
    const toast = useToast();

    useEffect(() => {
      if (open) {
        setName(""); setMinutes(30); setDistance(""); setMet(7);
        setBrowsing(false); setCat("All"); setSuggestion(null);
        setMachine("other"); setMachineParams({});
        setNewCat("Full Body"); setNewType("");
      }
    }, [open]);

    const recentExercises = useMemo(() => {
      const set = new Set();
      const list = [];
      const keys = Object.keys(data.days || {}).sort().reverse().slice(0, 30);
      for (const k of keys) {
        for (const w of (data.days[k].workouts || [])) {
          if (w.type === "strength" && !set.has(w.name)) {
            set.add(w.name); list.push(w.name);
            if (list.length >= 10) return list;
          }
        }
      }
      return list;
    }, [data.days, open]);

    const pickExercise = (nm) => {
      setName(nm);
      setSuggestion(suggestSetsFor(nm, data.days, data.customExercises));
      setBrowsing(false);
    };

    const knownExercise = useMemo(() => {
      const n = name.trim().toLowerCase();
      if (!n) return true;
      return combinedExerciseLibrary(data).some(e => e.name.toLowerCase() === n);
    }, [name, data.customExercises]);

    const curMachine = getMachine(machine);
    const previewCardioCalories = useMemo(() => {
      if (type !== "cardio") return 0;
      const w = { machine, minutes: Number(minutes)||0, met: Number(met), ...machineParams };
      return cardioCalories(w, data.profile.weightKg);
    }, [type, machine, minutes, met, machineParams, data.profile.weightKg]);

    const submit = () => {
      const nm = name.trim();
      if (!nm) { toast("Enter a name"); return; }
      const next = { ...data };
      const d = ensureDay(next.days, activeDate);
      let w;
      if (type === "strength") {
        const sets = suggestion ? suggestion.sets.map(s => ({ ...s })) : [{ weight: 0, reps: 8, rpe: "" }];
        w = { id: uid(), type: "strength", name: nm, sets, notes: "", time: Date.now(), calories: 0 };
        w.calories = strengthCalories(w, next.profile.weightKg);
        const known = combinedExerciseLibrary(next).some(e => e.name.toLowerCase() === nm.toLowerCase());
        if (!known) {
          next.customExercises = [...(next.customExercises || []), { name: nm, category: newCat || "Full Body", sets: 3, reps: 10, type: newType || classifyExerciseType(nm) }];
        }
      } else {
        w = {
          id: uid(), type: "cardio", name: nm,
          minutes: Number(minutes) || 30,
          distanceKm: distance === "" ? (curMachine.autoDistance ? curMachine.autoDistance({ minutes: Number(minutes)||0, ...machineParams }) : null) : Number(distance),
          met: Number(met),
          machine, ...machineParams,
          notes: "", time: Date.now(), calories: 0
        };
        w.calories = cardioCalories(w, next.profile.weightKg);
      }
      d.workouts.push(w);
      setData(next);
      toast("Workout added");
      onClose();
    };

    return h(Sheet, { open, onClose, title: "Add workout" },
      h("div", { className: "seg" },
        h("button", { className: type === "strength" ? "active" : "", onClick: () => setType("strength") }, "💪 Strength"),
        h("button", { className: type === "cardio" ? "active" : "", onClick: () => setType("cardio") }, "🏃 Cardio")
      ),

      type === "strength" && h(React.Fragment, null,
        h("div", { className: "field" },
          h("label", null, "Exercise"),
          h("div", { style: { display: "flex", gap: 8 } },
            h("input", {
              className: "input",
              value: name,
              onChange: (e) => { setName(e.target.value); setSuggestion(null); },
              placeholder: "e.g. Bench Press",
              autoCapitalize: "words"
            }),

  function CheckInSheet({ open, onClose, data, setData, date }) {
    const key = date || todayKey();
    const [kg, setKg] = useState("");
    const [sh, setSh] = useState("");
    const [sm, setSm] = useState("");
    const toast = useToast();
    useEffect(() => {
      if (!open) return;
      const w = entryOn(data.weightLog, key), sl = entryOn(data.sleepLog, key);
      setKg(w ? String(w.kg) : "");
      if (sl) { const m = Math.round(sl.hours * 60); setSh(String(Math.floor(m / 60))); setSm(String(m % 60)); }
      else { setSh(""); setSm(""); }
    }, [open, key]);
    const save = () => {
      const hadW = entryOn(data.weightLog, key), hadS = entryOn(data.sleepLog, key);
      const hasW = String(kg).trim() !== "";
      const hasS = String(sh).trim() !== "" || String(sm).trim() !== "";
      if (!hasW && !hasS && !hadW && !hadS) { toast("Enter your weight or sleep to save"); return; }
      const next = { ...data };
      if (hasW) {
        const v = Number(kg);
        if (!(v >= 30 && v <= 300)) { toast("Enter a weight between 30 and 300 kg"); return; }
        next.weightLog = upsertDated(data.weightLog, { date: key, kg: Math.round(v * 100) / 100 });
      } else if (hadW) {
        next.weightLog = (data.weightLog || []).filter(x => x.date !== key);
      }
      if (hasS) {
        const hh = Number(sh || 0), mm = Number(sm || 0);
        if (!isFinite(hh) || !isFinite(mm) || hh < 0 || mm < 0 || mm >= 60) { toast("Enter sleep as hours and minutes (0–59)"); return; }

        if (hours <= 0 || hours > 24) { toast("Sleep must be between 0 and 24 hours"); return; }
        next.sleepLog = upsertDated(data.sleepLog, { date: key, hours: Math.round(hours * 100) / 100 });
      } else if (hadS) {
        next.sleepLog = (data.sleepLog || []).filter(x => x.date !== key);
      }
      // Profile weight (used for calorie targets) follows your most recent weigh-in.
      const latest = (next.weightLog || []).slice().sort((a, b) => a.date.localeCompare(b.date)).slice(-1)[0];
      if (latest) next.profile = { ...next.profile, weightKg: latest.kg };
      setData(next);
      toast("Check-in saved");
      onClose();

  /* ---------- Stats (formerly History) ---------- */
  function bestWeightForName(days, needle) {
    let max = 0;
    const n = needle.toLowerCase();
    for (const k in days) {
      for (const w of (days[k].workouts || [])) {
        if (w.type !== "strength" || !w.name.toLowerCase().includes(n)) continue;
        for (const s of (w.sets || [])) {
          if (!s.warmup && Number(s.weight) > max) max = Number(s.weight);
        }
      }
    }
    return max;
  }

  function StrengthGoalRing({ label, current, target, color, unit }) {

          h("circle", { cx: size/2, cy: size/2, r, stroke: color, strokeWidth: stroke, fill: "none", strokeDasharray: c, strokeDashoffset: c - dash, strokeLinecap: "round" })
        ),
        h("div", { className: "ring-center" }, Math.round(pct) + "%")
      ),

  /* ---------- Exercise progress trend (Stats) ---------- */
  function ExerciseTrendSVG({ points, unit, color }) {
    const w = 320, ht = 150, pad = 16;
    const valOf = (p) => (p.v != null ? p.v : displayWeight(p.avgKg, unit));
    const vals = points.map(valOf);
    const minV = Math.min(...vals), maxV = Math.max(...vals);
    const range = (maxV - minV) || 1;
    const pts = points.map((p, i) => {
      const x = points.length > 1 ? pad + (i / (points.length - 1)) * (w - pad*2) : w/2;
      const y = points.length > 1
        ? ht - pad - ((valOf(p) - minV) / range) * (ht - pad*2)
        : ht/2;
      return [x, y];
    });
    const d = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    return h("div", { className: "chart-svg-wrap" },
      h("svg", { viewBox: "0 0 " + w + " " + ht, preserveAspectRatio: "none", width: "100%", height: ht },
        [0,1,2,3].map(i => h("line", { key: i, x1: pad, x2: w-pad, y1: pad + i*(ht-pad*2)/3, y2: pad + i*(ht-pad*2)/3, stroke: "var(--border)", strokeWidth: 1, strokeDasharray: "3,3" })),
        points.length > 1 && h("path", { d, stroke: color || "var(--success)", strokeWidth: 2.5, fill: "none", strokeLinecap: "round", strokeLinejoin: "round" }),
        pts.map((p, i) => h("circle", { key: i, cx: p[0], cy: p[1], r: 4, fill: color || "var(--success)" }))
      )
    );
  }
  function ExerciseProgressChart({ data }) {
    const [selected, setSelected] = useState("");
    const [metric, setMetric] = useState("weight"); // weight | e1rm | volume
    const exerciseNames = useMemo(() => {
      const set = new Set();
      Object.values(data.days || {}).forEach(d => (d.workouts || []).forEach(w => { if (w.type === "strength") set.add(w.name); }));
      return [...set].sort((a,b) => a.localeCompare(b));
    }, [data.days]);

    useEffect(() => {
      if (exerciseNames.length && !exerciseNames.includes(selected)) setSelected(exerciseNames[0]);
    }, [exerciseNames.join("|")]);

    const unit = (data.exerciseUnits || {})[selected] || "kg";
    const isVolume = metric === "volume";
    const metricUnit = isVolume ? (unit === "lbs" ? "k " + unit : "t") : unit; // volume shown in tonnes / thousand-lb

    // One point per day the exercise was logged. For each metric we derive a display value `v`.
    const points = useMemo(() => {
      if (!selected) return [];
      const out = [];
      Object.keys(data.days || {}).sort().forEach(k => {
        const d = data.days[k];
        let sum = 0, count = 0, best1rm = 0, vol = 0;
        (d.workouts || []).forEach(w => {
          if (w.type === "strength" && w.name === selected) {
            (w.sets || []).forEach(s => {
              if (s.warmup) return;
              const wt = Number(s.weight) || 0, rp = Number(s.reps) || 0;
              if (wt > 0) { sum += wt; count++; }
              const e = est1RM(wt, rp); if (e > best1rm) best1rm = e;
              vol += wt * rp;
            });
          }
        });
        if (count > 0 || vol > 0) {
          let v;
          if (metric === "e1rm") v = displayWeight(best1rm, unit);
          else if (metric === "volume") v = Math.round(displayWeight(vol, unit) / 1000 * 100) / 100;
          else v = count > 0 ? displayWeight(sum / count, unit) : 0;
          out.push({ key: k, v });
        }
      });
      return out;
    }, [data.days, selected, metric]);

    if (exerciseNames.length === 0) {
      return h("div", { className: "card" },
        h("h2", null, "Exercise progress"),
        h("div", { className: "empty-state" },
          h("div", { className: "ic" }, "📈"),
          h("div", { className: "t" }, "No strength workouts yet"),
          h("div", { className: "s" }, "Log a few sessions to see your weight trend here")
        )

  function DualLineChart({ series, colorA, colorB, labelA, labelB }) {
    const w = 320, ht = 150, pad = 10;
    const maxA = Math.max(1, ...series.map(s => s.a));
    const maxB = Math.max(1, ...series.map(s => s.b));
    const ptsFor = (key, max) => series.map((s, i) => {
      const x = pad + (i / Math.max(1, series.length - 1)) * (w - pad*2);
      const y = ht - pad - (max ? (s[key] / max) : 0) * (ht - pad*2);
      return [x, y];
    });
    const dFor = (pts) => pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    const ptsA = ptsFor("a", maxA), ptsB = ptsFor("b", maxB);
    return h("div", { className: "chart-svg-wrap" },
      h("svg", { viewBox: "0 0 " + w + " " + ht, preserveAspectRatio: "none", width: "100%", height: ht },
        [0,1,2,3].map(i => h("line", { key: i, x1: pad, x2: w-pad, y1: pad + i*(ht-pad*2)/3, y2: pad + i*(ht-pad*2)/3, stroke: "var(--border)", strokeWidth: 1, strokeDasharray: "3,3" })),
        h("path", { d: dFor(ptsB), stroke: colorB, strokeWidth: 2, fill: "none", strokeLinecap: "round", strokeLinejoin: "round", opacity: 0.85 }),

  /* ---------- Progress photo store (blobs in IndexedDB, kept out of the JSON) ---------- */
  const photoStore = (function () {
    const DB = "fittrack-photos", STORE = "img";
    function db() {
      return new Promise((res, rej) => {
        const r = indexedDB.open(DB, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(STORE);
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    }
    async function put(id, blob) { try { const d = await db(); return await new Promise((res, rej) => { const t = d.transaction(STORE, "readwrite").objectStore(STORE).put(blob, id); t.onsuccess = () => res(true); t.onerror = () => rej(t.error); }); } catch (e) { return false; } }
    async function get(id) { try { const d = await db(); return await new Promise((res, rej) => { const t = d.transaction(STORE, "readonly").objectStore(STORE).get(id); t.onsuccess = () => res(t.result || null); t.onerror = () => rej(t.error); }); } catch (e) { return null; } }
    async function del(id) { try { const d = await db(); return await new Promise((res, rej) => { const t = d.transaction(STORE, "readwrite").objectStore(STORE).delete(id); t.onsuccess = () => res(true); t.onerror = () => rej(t.error); }); } catch (e) { return false; } }
    return { put, get, del };
  })();

  /* ---------- Stats time windows + charts ---------- */
  const STATS_RANGES = [
    { id: "7d", label: "7D", days: 7, text: "Last 7 days" },
    { id: "14d", label: "14D", days: 14, text: "Last 14 days" },
    { id: "1m", label: "1M", days: 30, text: "Last 30 days" },
    { id: "3m", label: "3M", days: 90, text: "Last 90 days" },
    { id: "all", label: "All", days: null, text: "All time" }
  ];
  // Earliest date anything was recorded (meals, workouts, weigh-ins, sleep, measurements).
  function recordsStartKey(data) {
    let min = null;
    const consider = (k) => { if (k && /^\d{4}-\d{2}-\d{2}$/.test(k) && (!min || k < min)) min = k; };
    Object.keys(data.days || {}).forEach(k => {
      const d = data.days[k];
      if (d && ((d.meals || []).length || (d.workouts || []).length)) consider(k);
    });
    (data.weightLog || []).forEach(x => consider(x.date));
    (data.sleepLog || []).forEach(x => consider(x.date));
    (data.measurements || []).forEach(x => consider(x.date));
    return min;
  }
  function rangeDaysFor(id, data) {
    const r = STATS_RANGES.find(x => x.id === id) || STATS_RANGES[0];
    if (r.days) return r.days;
    const start = recordsStartKey(data);
    if (!start) return 7;
    return Math.max(1, daysBetween(start, todayKey()) + 1);
  }
  function rollingAvg(points, windowDays) {
    return points.map((p, i) => {
      const cutoff = shift(p.date, -(windowDays - 1));
      let sum = 0, n = 0;
      for (let j = i; j >= 0 && points[j].date >= cutoff; j--) { sum += points[j].v; n++; }
      return { date: p.date, v: sum / n };
    });
  }
  function niceTicks(min, max, count) {
    const span = (max - min) || 1;
    const raw = span / Math.max(1, count);
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 1000) / 1000);
    return { lo, hi: Math.max(hi, lo + step), ticks, step };
  }
  function xLabelKeys(startKey, endKey) {
    const total = daysBetween(startKey, endKey);
    if (total <= 0) return [startKey];
    return [startKey, shift(startKey, Math.round(total / 2)), endKey];
  }

  // Date-scaled line chart. series[0] drives the tap/hover readout; later series draw on top.
  function TrendLineChart({ startKey, endKey, series, band, yInclude, fmtTick, readout, ariaLabel }) {
    const W = 320, H = 170, L = 32, R = 8, T = 10, B = 22;
    const total = Math.max(1, daysBetween(startKey, endKey));
    const vals = series.flatMap(sr => sr.points.map(p => p.v));
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (yInclude) { lo = Math.min(lo, yInclude[0]); hi = Math.max(hi, yInclude[1]); }
    if (hi - lo < 1) { lo -= 0.5; hi += 0.5; }
    const nt = niceTicks(lo, hi, 3);
    const yMin = nt.lo, yMax = nt.hi;
    const xOf = (k) => L + (daysBetween(startKey, k) / total) * (W - L - R);
    const yOf = (v) => T + (1 - (v - yMin) / ((yMax - yMin) || 1)) * (H - T - B);
    const primary = series[0];
    const [pick, setPick] = useState(null);
    useEffect(() => { setPick(null); }, [startKey, endKey, primary.points.length]);
    const svgRef = useRef(null);
    const pickAt = (e) => {
      const svg = svgRef.current;
      if (!svg || !primary.points.length) return;
      const rect = svg.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * W;
      let best = 0, bd = Infinity;
      primary.points.forEach((p, i) => { const d = Math.abs(xOf(p.date) - x); if (d < bd) { bd = d; best = i; } });
      setPick(best);
    };
    const pathFor = (pts) => pts.map((p, i) => (i ? "L" : "M") + xOf(p.date).toFixed(1) + "," + yOf(p.v).toFixed(1)).join(" ");
    const sel = pick != null ? primary.points[pick] : primary.points[primary.points.length - 1];
    const tickTxt = fmtTick || ((v) => (nt.step < 1 ? v.toFixed(1) : String(v)));
    const xl = xLabelKeys(startKey, endKey);
    return h("div", null,
      sel && h("div", { className: "chart-readout", "aria-live": "polite" },
        h("div", { className: "rv" }, readout(sel).value),
        h("div", { className: "rd" }, readout(sel).sub)
      ),
      h("svg", {
        ref: svgRef, className: "line-chart", viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": ariaLabel,
        onPointerDown: pickAt,
        onPointerMove: (e) => { if (e.pointerType === "mouse" || e.buttons) pickAt(e); },
        onPointerLeave: (e) => { if (e.pointerType === "mouse") setPick(null); }
      },
        band && band.to > yMin && band.from < yMax && h("rect", {
          x: L, width: W - L - R,
          y: yOf(Math.min(band.to, yMax)), height: Math.max(0, yOf(Math.max(band.from, yMin)) - yOf(Math.min(band.to, yMax))),
          fill: band.color
        }),
        nt.ticks.map(v => h("g", { key: "t" + v },
          h("line", { x1: L, x2: W - R, y1: yOf(v), y2: yOf(v), stroke: "var(--border)", strokeWidth: 1, strokeDasharray: "3,3" }),
          h("text", { x: L - 5, y: yOf(v) + 3, textAnchor: "end" }, tickTxt(v))
        )),
        series.map((sr, si) => h("g", { key: "s" + si, opacity: sr.opacity == null ? 1 : sr.opacity },
          sr.points.length > 1 && h("path", { d: pathFor(sr.points), stroke: sr.color, strokeWidth: sr.width || 2, fill: "none", strokeLinecap: "round", strokeLinejoin: "round" }),
          sr.dots && sr.points.length <= 60 && sr.points.map((p, i) => h("circle", { key: i, cx: xOf(p.date), cy: yOf(p.v), r: 2.4, fill: sr.color }))
        )),
        sel && h("g", null,
          h("line", { x1: xOf(sel.date), x2: xOf(sel.date), y1: T, y2: H - B, stroke: "var(--muted-soft)", strokeWidth: 1 }),
          h("circle", { cx: xOf(sel.date), cy: yOf(sel.v), r: 4.5, fill: "var(--card)", stroke: primary.color, strokeWidth: 2 })
        ),
        xl.map((k, i) => h("text", { key: "x" + i, x: xOf(k), y: H - 6, textAnchor: i === 0 ? "start" : i === xl.length - 1 ? "end" : "middle" }, fmtShortDate(k)))
      )
    );
  }

  // Calories per day; switches to weekly averages (of logged days) for windows longer than a month.
  function CalorieBarChart({ rows, target }) {
    const weekly = rows.length > 31;
    const bars = [];
    if (!weekly) {
      rows.forEach(r => bars.push({ start: r.key, end: r.key, v: r.calories, n: r.calories > 0 ? 1 : 0, len: 1 }));
    } else {
      for (let end = rows.length - 1; end >= 0; end -= 7) {
        const chunk = rows.slice(Math.max(0, end - 6), end + 1);
        const logged = chunk.filter(r => r.calories > 0);
        bars.unshift({ start: chunk[0].key, end: chunk[chunk.length - 1].key, v: logged.length ? logged.reduce((a, r) => a + r.calories, 0) / logged.length : 0, n: logged.length, len: chunk.length });
      }
    }
    const W = 320, H = 170, L = 36, R = 6, T = 12, B = 22;
    const nt = niceTicks(0, Math.max(target * 1.15, ...bars.map(b => b.v), 100), 3);
    const yOf = (v) => T + (1 - v / nt.hi) * (H - T - B);
    const slot = (W - L - R) / bars.length;
    const bw = Math.max(1.5, slot * (bars.length > 20 ? 0.62 : 0.56));
    const [pick, setPick] = useState(null);
    useEffect(() => { setPick(null); }, [rows.length]);
    const svgRef = useRef(null);
    const pickAt = (e) => {
      const svg = svgRef.current; if (!svg) return;
      const rect = svg.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * W;
      setPick(Math.max(0, Math.min(bars.length - 1, Math.floor((x - L) / slot))));
    };
    let defIdx = bars.length - 1;

  function LegacyHistorySection({ data }) {
    // PRs
    const prs = useMemo(() => {
      const map = {};
      for (const k in data.days) {
        for (const w of (data.days[k].workouts || [])) {
          if (w.type !== "strength") continue;
          for (const s of (w.sets || [])) {
            if (!s.weight || !s.reps) continue;
            const cur = map[w.name];
            const vol = s.weight * s.reps;
            // 1RM Epley estimate
            const e1rm = s.weight * (1 + s.reps/30);
            if (!cur || vol > cur.vol) {
              map[w.name] = { vol, weight: s.weight, reps: s.reps, date: k, e1rm: Math.round(e1rm*10)/10 };
            }
          }
        }
      }
      return Object.entries(map).sort((a,b) => b[1].e1rm - a[1].e1rm).slice(0, 8);
    }, [data.days]);

    return h("div", null,
      // PRs
      h("div", { className: "card" },

  /* ---------- Monthly review ---------- */
  function prsInRange(data, days) {
    if (!days.length) return [];
    const startKey = days[0];
    const priorBest = {};
    Object.keys(data.days || {}).forEach(k => {
      if (k >= startKey) return;
      (data.days[k].workouts || []).forEach(w => {
        if (w.type !== "strength") return;
        (w.sets || []).forEach(s => {
          if (!s.weight || !s.reps || s.warmup) return;
          const e1rm = s.weight * (1 + s.reps / 30);
          if (!priorBest[w.name] || e1rm > priorBest[w.name]) priorBest[w.name] = e1rm;
        });
      });
    });
    const monthBest = {};
    days.forEach(k => {
      const d = data.days[k];
      if (!d) return;
      (d.workouts || []).forEach(w => {
        if (w.type !== "strength") return;
        (w.sets || []).forEach(s => {
          if (!s.weight || !s.reps || s.warmup) return;
          const e1rm = s.weight * (1 + s.reps / 30);
          if (!monthBest[w.name] || e1rm > monthBest[w.name].e1rm) {
            monthBest[w.name] = { e1rm: Math.round(e1rm * 10) / 10, weight: s.weight, reps: s.reps, date: k };
          }
        });
      });
    });
    const prs = [];
    Object.keys(monthBest).forEach(name => {
      if (monthBest[name].e1rm > (priorBest[name] || 0)) prs.push({ name, ...monthBest[name] });
    });
    return prs.sort((a, b) => b.e1rm - a.e1rm);
  }

  function computeMonthlyReview(data, year, month) {
    const targets = computeTargets(data.profile);
    const todayK = todayKey();
    const allDays = daysInMonthArr(year, month);
    const isCurrentMonth = todayK >= allDays[0] && todayK <= allDays[allDays.length - 1];
    const elapsedDays = isCurrentMonth ? allDays.filter(k => k <= todayK) : allDays;

    let loggedDays = 0, sumCal = 0, sumP = 0, sumC = 0, sumF = 0, sumBurn = 0;
    let daysOnTarget = 0, daysOver = 0, daysUnder = 0;
    const qAcc = qualityAccumulator();
    elapsedDays.forEach(k => {
      const t = dayTotals(data.days[k]);
      if (t.calories > 0) {
        loggedDays++;
        qAcc.add(t);
        sumCal += t.calories; sumP += t.protein; sumC += t.carbs; sumF += t.fat;
        sumBurn += dayBurn(data.days[k]);
        const pct = targets.calories ? (t.calories / targets.calories) * 100 : 0;
        if (pct >= 85 && pct <= 115) daysOnTarget++;
        else if (pct > 115) daysOver++;
        else daysUnder++;
      }
    });
    const nutrition = {
      loggedDays,
      avgCalories: loggedDays ? Math.round(sumCal / loggedDays) : 0,
      avgProtein: loggedDays ? Math.round(sumP / loggedDays) : 0,
      avgCarbs: loggedDays ? Math.round(sumC / loggedDays) : 0,
      avgFat: loggedDays ? Math.round(sumF / loggedDays) : 0,
      avgBurn: loggedDays ? Math.round(sumBurn / loggedDays) : 0,
      daysOnTarget, daysOver, daysUnder,
      adherencePct: loggedDays ? Math.round((daysOnTarget / loggedDays) * 100) : 0,
      quality: qAcc.result(loggedDays), calTarget: targets.calories
    };

    let sessions = 0, strengthSessions = 0, cardioSessions = 0, totalVolume = 0, totalSets = 0, totalReps = 0, cardioMinutes = 0, cardioKm = 0;
    const trainingDaySet = new Set();
    elapsedDays.forEach(k => {
      const d = data.days[k];
      if (!d || !(d.workouts || []).length) return;
      trainingDaySet.add(k);
      (d.workouts || []).forEach(w => {
        sessions++;
        if (w.type === "strength") {
          strengthSessions++;
          const t = exerciseTotals(w);
          totalVolume += t.totalWeight; totalReps += t.totalReps; totalSets += (w.sets || []).length;
        } else {
          cardioSessions++;
          cardioMinutes += w.minutes || 0;
          cardioKm += w.distanceKm || 0;
        }
      });
    });
    const totalBurn = elapsedDays.reduce((s, k) => s + dayBurn(data.days[k]), 0);
    const training = {
      sessions, strengthSessions, cardioSessions,
      trainingDays: trainingDaySet.size,
      totalVolumeTons: Math.round(totalVolume / 100) / 10,
      totalSets, totalReps,
      cardioMinutes, cardioKm: Math.round(cardioKm * 10) / 10,
      totalBurn: Math.round(totalBurn),
      prs: prsInRange(data, elapsedDays)
    };

    const weightEntries = (data.weightLog || [])
      .filter(w => w.date >= allDays[0] && w.date <= elapsedDays[elapsedDays.length - 1])
      .sort((a, b) => a.date.localeCompare(b.date));
    const weight = weightEntries.length ? {
      start: weightEntries[0].kg,
      end: weightEntries[weightEntries.length - 1].kg,
      delta: Math.round((weightEntries[weightEntries.length - 1].kg - weightEntries[0].kg) * 10) / 10
    } : null;

    return {
      year, month, label: monthLabel(year, month), isCurrentMonth,
      daysInMonth: allDays.length, daysElapsed: elapsedDays.length,
      nutrition, training, weight, targets, profileGoal: data.profile.goal,
      micro: periodNutrientStats(data, elapsedDays)
    };
  }

  function generateInsights(review) {
    const { nutrition, training, weight, daysElapsed, targets, profileGoal } = review;
    const insights = [];

    if (nutrition.loggedDays === 0) {
      insights.push({ level: "bad", text: "No meals logged this month yet — log your food to unlock nutrition insights." });
    } else {
      const logRate = daysElapsed ? nutrition.loggedDays / daysElapsed : 0;
      if (logRate < 0.5) insights.push({ level: "bad", text: "Meals logged on only " + nutrition.loggedDays + " of " + daysElapsed + " days — consistent logging is the biggest lever for hitting your goal." });
      else if (logRate < 0.85) insights.push({ level: "warn", text: "Logged " + nutrition.loggedDays + " of " + daysElapsed + " days — try to close the gap on the missing days." });
      else insights.push({ level: "good", text: "Great consistency — meals logged on " + nutrition.loggedDays + " of " + daysElapsed + " days." });

      if (nutrition.adherencePct >= 70) {
        insights.push({ level: "good", text: nutrition.adherencePct + "% of logged days landed within range of your " + targets.calories + " kcal target." });
      } else if (nutrition.daysOver >= nutrition.daysUnder) {
        insights.push({ level: "warn", text: "Calories ran over target on " + nutrition.daysOver + " of " + nutrition.loggedDays + " logged days — averaged " + nutrition.avgCalories + " kcal vs a " + targets.calories + " kcal target." });
      } else {
        insights.push({ level: "warn", text: "Calories ran under target on " + nutrition.daysUnder + " of " + nutrition.loggedDays + " logged days — averaged " + nutrition.avgCalories + " kcal vs a " + targets.calories + " kcal target." });
      }

      const proteinPct = targets.protein ? Math.round((nutrition.avgProtein / targets.protein) * 100) : 0;
      if (proteinPct >= 90) insights.push({ level: "good", text: "Protein averaged " + nutrition.avgProtein + "g/day, " + proteinPct + "% of your " + targets.protein + "g target." });
      else insights.push({ level: "bad", text: "Protein averaged only " + nutrition.avgProtein + "g vs a " + targets.protein + "g target — add a shake or extra protein serving to close the gap." });
    }

    const weeksElapsed = Math.max(1, daysElapsed / 7);
    const perWeek = training.trainingDays / weeksElapsed;
    if (training.trainingDays === 0) {
      insights.push({ level: "bad", text: "No workouts logged this month." });
    } else if (perWeek < 2) {
      insights.push({ level: "warn", text: "Averaged " + perWeek.toFixed(1) + " training days/week (" + training.trainingDays + " total) — aim for at least 3 for steady progress." });
    } else {
      insights.push({ level: "good", text: training.trainingDays + " training days this month, averaging " + perWeek.toFixed(1) + "/week." });
    }

    if (training.strengthSessions > 0 && training.cardioSessions === 0) {
      insights.push({ level: "warn", text: "No cardio logged — a couple of sessions a week can help recovery and conditioning." });
    }

    if (training.prs && training.prs.length) {
      insights.push({ level: "good", text: "New personal best" + (training.prs.length > 1 ? "s" : "") + " on " + training.prs.slice(0, 3).map(p => p.name).join(", ") + " this month." });
    }

    if (weight && weight.delta !== 0) {
      const gained = weight.delta > 0;
      if (profileGoal === "cut" && gained) insights.push({ level: "warn", text: "Weight moved up " + weight.delta + " kg this month while your goal is fat loss — check portion sizes and adherence." });
      else if ((profileGoal === "bulk" || profileGoal === "lean-bulk") && !gained) insights.push({ level: "warn", text: "Weight moved down " + Math.abs(weight.delta) + " kg while your goal is to build muscle — consider a slightly higher calorie target." });
      else insights.push({ level: "good", text: "Weight moved " + (gained ? "up " : "down ") + Math.abs(weight.delta) + " kg this month, in line with your goal." });
    }

    micronutrientInsights(review.micro).forEach(i => insights.push(i));
    return insights;
  }

  /* ---------- Sample data ---------- */
  function makeSampleData(profile) {
    const data = defaultData();
    data.profile = { ...data.profile, ...profile, weightKg: profile.weightKg || 75 };
    data.onboarded = true;
    const t = todayKey();
    // 6 days of meals/workouts
    const sampleFoods = (slot, items) => items.map(([id, qty]) => {
      const f = MOCK_FOODS.find(x => x.id === id);
      return f ? { ...f, id: uid(), slot, qty: qty || 1, time: Date.now() } : null;
    }).filter(Boolean);
    for (let i = 0; i < 6; i++) {
      const key = shift(t, -i);
      data.days[key] = { meals: [], workouts: [] };
      data.days[key].meals.push(
        ...sampleFoods("breakfast", [["oats", 1], ["banana", 1], ["whey-protein", 1]]),
        ...sampleFoods("lunch", [["roti", 2], ["dal-toor", 1], ["okra-sabji", 1], ["curd", 0.5]]),
        ...sampleFoods("snacks", [["almonds", 1], ["apple", 1]]),
        ...sampleFoods("dinner", [["chicken-breast", 1.5], ["rice-brown", 1], ["broccoli", 1]])
      );
      if (i % 2 === 0) {
        const w = { id: uid(), type: "strength", name: i % 4 === 0 ? "Bench Press" : "Squat", sets: [
          { weight: 60, reps: 8, rpe: 7 }, { weight: 60, reps: 8, rpe: 7.5 }, { weight: 60, reps: 7, rpe: 8 }
        ], notes: "", time: Date.now(), calories: 0 };
        w.calories = strengthCalories(w, data.profile.weightKg);
        data.days[key].workouts.push(w);
      } else {
        const w = { id: uid(), type: "cardio", name: "Running", minutes: 30, distanceKm: 5, met: 9, notes: "", time: Date.now(), calories: 0 };
        w.calories = cardioCalories(w, data.profile.weightKg);
        data.days[key].workouts.push(w);
      }
    }
    // Weight log: gradual upward trend (bulk)
    for (let i = 13; i >= 0; i--) {
      data.weightLog.push({ date: shift(t, -i), kg: Math.round((data.profile.weightKg - 0.6 + (13-i)*0.05) * 10) / 10 });
    }
    // Sleep log: nightly hours between ~6h20 and ~8h
    for (let i = 13; i >= 0; i--) {
      data.sleepLog.push({ date: shift(t, -i), hours: Math.round((6.35 + ((i * 37) % 17) / 10) * 4) / 4 });
    }
    return data;
  }

  /* ---------- App root ---------- */
  function App() {
    const [data, setDataRaw] = useState(loadData);
    const [tab, setTab] = useState("dashboard");
    const [activeDate, setActiveDate] = useState(todayKey());
    const [sheet, setSheet] = useState(null); // { type, slot? }
    const [reminderTick, setReminderTick] = useState(0);
    const toast = useToast();

    const setData = useCallback((next) => {
      setDataRaw(next);
      safeLS.set(STORAGE_KEY, JSON.stringify(next));
    }, []);

    // Automated local backup (spec #2–4): debounced after any change, and once on load
    // as a daily catch-up. Idempotent — only dates whose content changed get appended.
    useEffect(() => {
      const t = setTimeout(() => { saveDailyLogsLocally(dataToCSVRows(data)); }, 4000);
      return () => clearTimeout(t);
    }, [data]);

    // Onboarding: prompt for profile on first load
    useEffect(() => {
      if (!data.onboarded) {
        setSheet({ type: "profile" });
      }
    }, []);

    const openAddMeal = (slot) => setSheet({ type: "add-meal", slot });
    const openAddWorkout = () => setSheet({ type: "add-workout" });
    const closeSheet = () => setSheet(null);

    const exportData = () => {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "fittrack-backup-" + todayKey() + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 500);
      toast("Backup downloaded");
    };
    const importData = () => {
      const inp = document.createElement("input");
      inp.type = "file";
      inp.accept = "application/json,.json";
      inp.onchange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const parsed = JSON.parse(r.result);
            if (!confirm("This will replace your current data. Continue?")) return;
            setData(migrate(parsed));
            toast("Backup imported");
          } catch(e) { toast("Invalid backup file"); }
        };
        r.readAsText(file);
      };
      inp.click();
    };
    const resetData = () => {
      if (!confirm("Erase ALL data? This cannot be undone.")) return;
      if (!confirm("Are you absolutely sure?")) return;
      const fresh = defaultData();
      setData(fresh);
      setActiveDate(todayKey());
      toast("Reset complete");
    };
    const downloadFile = (content, filename, mime) => {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 500);
    };
    const exportCSV = () => {
      const rows = dataToCSVRows(data);
      if (!rows.length) { toast("Nothing to export yet"); return; }
      downloadFile(rowsToCSV(rows), "fittrack-logs-" + todayKey() + ".csv", "text/csv");
      toast("CSV exported (" + rows.length + " rows)");
    };
    const importCSV = () => {
      const inp = document.createElement("input");
      inp.type = "file";
      inp.accept = "text/csv,.csv";
      inp.onchange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const rows = parseCSV(r.result);
            if (!rows.length) { toast("No rows found in CSV"); return; }
            if (!confirm("Add " + rows.length + " rows from this CSV to your existing logs? (Profile & settings are unaffected — use JSON backup for a full restore.)")) return;
            const { next, counts } = csvRowsIntoData(data, rows);
            setData(next);
            toast("Imported " + counts.meals + " meals, " + (counts.sets ? counts.sets + " sets" : "0 sets") + ", " + counts.cardio + " cardio, " + counts.weight + " weigh-ins, " + (counts.sleep || 0) + " sleep logs");
          } catch(e) { toast("Could not read CSV file"); }
        };
        r.readAsText(file);
      };
      inp.click();
    };
    const loadSample = () => {
      if (Object.keys(data.days).length > 0 && !confirm("Replace current data with sample data?")) return;
      setData(makeSampleData(data.profile));
      toast("Sample data loaded");
    };

    const tabs = [
      { id: "dashboard", name: "Home", icon: "grid" },
      { id: "stats", name: "Stats", icon: "trendingUp" },
      { id: "workouts", name: "Train", icon: "dumbbell", center: true },
      { id: "meals", name: "Meals", icon: "clipboard" },
      { id: "review", name: "Review", icon: "calendarCheck" },
      { id: "profile", name: "Settings", icon: "settingsGear" }
    ];

    return h("div", { className: "app" },
      h("main", { className: "content" },
        !data.hideInstallBanner && tab === "dashboard" && h(InstallBanner, {
          onDismiss: () => setData({ ...data, hideInstallBanner: true })
        }),
        tab === "dashboard" && backupReminderDue() && h(BackupReminderBanner, {
          data, onDone: () => setReminderTick(t => t + 1)
        }),
        tab === "dashboard" && h(Dashboard, { data, setData, activeDate, setActiveDate, openCheckIn: () => setSheet({ type: "checkin", date: activeDate }), openNutritionGoal: () => setSheet({ type: "nutrition-goal" }), goToStats: () => setTab("stats") }),
        tab === "meals" && h(MealsTab, { data, setData, activeDate, setActiveDate, openAddMeal, openDietPlan: () => setSheet({ type: "diet-plan" }), openSheet: (t) => setSheet({ type: t }) }),
        tab === "workouts" && h(WorkoutsTab, { data, setData, activeDate, setActiveDate, openAddWorkout }),
        tab === "stats" && h(StatsTab, { data, setData }),
        tab === "review" && h(MonthlyReviewTab, { data }),
        tab === "profile" && h(ProfileTab, { data, setData, onOpenSheet: (t) => setSheet({ type: t }), importData, exportData, importCSV, exportCSV, resetData, loadSample })
      ),

      // FABs
      (tab === "meals") && h("button", {
        className: "fab", onClick: () => openAddMeal("snacks"), "aria-label": "Add meal"
      }, Icon("plus", 26)),
      (tab === "workouts") && h("button", {
        className: "fab", onClick: openAddWorkout, "aria-label": "Add workout"
      }, Icon("plus", 26)),

      // Bottom nav
      h("nav", { className: "bottom-nav" },
        tabs.map(t => t.center
          ? h("div", { key: t.id, className: "nav-center-wrap" },
              h("div", null,
                h("button", { className: "nav-center-btn" + (tab === t.id ? " active" : ""), onClick: () => setTab(t.id), "aria-label": t.name }, Icon(t.icon, 24)),
                h("div", { className: "nav-center-lbl" + (tab === t.id ? " active" : "") }, t.name)
              )
            )
          : h("button", {
              key: t.id,
              className: tab === t.id ? "active" : "",
              onClick: () => setTab(t.id),
              "aria-label": t.name
            }, Icon(t.icon, 22), h("span", null, t.name))
        )
      ),

      // Sheets
      h(AddMealSheet, { open: sheet && sheet.type === "add-meal", onClose: closeSheet, data, setData, activeDate, slot: sheet && sheet.slot }),
      h(AddWorkoutSheet, { open: sheet && sheet.type === "add-workout", onClose: closeSheet, data, setData, activeDate }),
      h(WeightSheet, { open: sheet && sheet.type === "weight", onClose: closeSheet, data, setData }),
      h(CheckInSheet, { open: sheet && sheet.type === "checkin", onClose: closeSheet, data, setData, date: sheet && sheet.date }),
      h(NutritionGoalSheet, { open: sheet && sheet.type === "nutrition-goal", onClose: closeSheet, data, setData }),
      h(DietPlanUploadSheet, { open: sheet && sheet.type === "diet-plan", onClose: closeSheet, data, setData }),
      h(ProfileSheet, { open: sheet && sheet.type === "profile", onClose: closeSheet, data, setData }),
      h(ProvidersSheet, { open: sheet && sheet.type === "providers", onClose: closeSheet, data, setData }),
      h(SupplementsSheet, { open: sheet && sheet.type === "supplements", onClose: closeSheet, data, setData }),
      h(DayNutrientsSheet, { open: sheet && sheet.type === "day-nutrients", onClose: closeSheet, data, activeDate }),
      h(NutrientTargetsSheet, { open: sheet && sheet.type === "nutrient-targets", onClose: closeSheet, data, setData }),
      h(FillNutrientsSheet, { open: sheet && sheet.type === "fill-nutrients", onClose: closeSheet, data, setData })
    );
  }

  /* ---------- Mount ---------- */
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(h(ToastProvider, null, h(App)));

  /* ---------- Service Worker (best effort) ---------- */
  if ("serviceWorker" in navigator) {
    const swCode = "const C='fittrack-v1';self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.open(C).then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{try{c.put(e.request,res.clone())}catch(x){}return res}).catch(()=>r))))});";
    try {
      const blob = new Blob([swCode], { type: "application/javascript" });
      const url = URL.createObjectURL(blob);
      navigator.serviceWorker.register(url).catch(() => {});
    } catch(e) {}
  }
})();
</script>
</body>
</html>
