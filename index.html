  // ---- Open Food Facts lookup (barcode → food); free, no key. Network required. ----
  async function lookupOpenFoodFacts(barcode) {
    const url = "https://world.openfoodfacts.org/api/v2/product/" + encodeURIComponent(barcode) +

      id: "off-" + barcode,

    { id: "push", name: "Push Day", emoji: "💪", goals: ["bulk","lean-bulk","maintain"], exercises: ["Bench Press","Overhead Press","Incline Dumbbell Press","Triceps Pushdown","Lateral Raise"] },
    { id: "pull", name: "Pull Day", emoji: "🏋️", goals: ["bulk","lean-bulk","maintain"], exercises: ["Deadlift","Barbell Row","Lat Pulldown","Face Pull","Bicep Curl"] },
    { id: "legs", name: "Leg Day", emoji: "🦵", goals: ["bulk","lean-bulk","maintain"], exercises: ["Squat","Romanian Deadlift","Leg Press","Leg Curl","Calf Raise"] },
    { id: "upper", name: "Upper Body", emoji: "🔼", goals: ["bulk","lean-bulk","maintain","cut"], exercises: ["Bench Press","Barbell Row","Overhead Press","Lat Pulldown"] },
    { id: "lower", name: "Lower Body", emoji: "🔽", goals: ["bulk","lean-bulk","maintain","cut"], exercises: ["Squat","Deadlift","Leg Press","Calf Raise"] },
    { id: "fullbody", name: "Full Body Strength", emoji: "⚡", goals: ["bulk","lean-bulk","maintain","cut"], exercises: ["Squat","Bench Press","Barbell Row","Overhead Press"] },
    { id: "core", name: "Core & Conditioning", emoji: "🧘", goals: ["cut","maintain"], exercises: ["Plank","Hanging Leg Raise","Russian Twist","Cable Crunch"] },
    { id: "fatloss", name: "Fat Loss Circuit", emoji: "🔥", goals: ["cut"], exercises: ["Goblet Squat","Push-up","Kettlebell Swing","Mountain Climbers","Burpees"] }
  ];
  function templatesForGoal(goal) {
    const rec = WORKOUT_TEMPLATES.filter(t => t.goals.includes(goal));
    const rest = WORKOUT_TEMPLATES.filter(t => !t.goals.includes(goal));
    return [...rec.map(t => ({ ...t, recommended: true })), ...rest.map(t => ({ ...t, recommended: false }))];
  }

  /* ---------- Progressive-overload set suggestions ---------- */
  function suggestSetsFor(exerciseName, days, customExercises) {
    const n = (exerciseName || "").toLowerCase().trim();
    let best = null, bestKey = null;
    Object.keys(days || {}).sort().reverse().forEach(k => {
      if (best) return;
      for (const w of (days[k].workouts || [])) {
        if (w.type === "strength" && w.name.toLowerCase().trim() === n) { best = w; bestKey = k; break; }
      }
    });
    if (best && (best.sets || []).length) {
      const lastSets = best.sets.filter(s => !s.warmup);
      if (lastSets.length) {
        const allHitTarget = lastSets.every(s => (Number(s.reps)||0) >= (findExerciseMeta(exerciseName, customExercises) || { reps: 8 }).reps);
        const bump = allHitTarget ? 2.5 : 0;
        return {
          fromDate: bestKey,
          sets: lastSets.map(s => ({ weight: Math.round(((Number(s.weight)||0) + bump) * 2) / 2, reps: Number(s.reps) || 8, rpe: "" }))
        };
      }
    }
    const meta = findExerciseMeta(exerciseName, customExercises);
    const n1 = meta ? meta.sets : 3;
    const r1 = meta ? meta.reps : 10;
    return { fromDate: null, sets: Array.from({ length: n1 }, () => ({ weight: 0, reps: r1, rpe: "" })) };
  }

  /* ---------- Day data helpers ---------- */
  function ensureDay(days, key) {
    if (!days[key]) {
      days[key] = { meals: [], workouts: [], weightKg: null };
    }
    return days[key];
  }
  // Sums a day's meals. Unknown (null) values are skipped and counted, so `known[k] / items`
  // tells how much of the day a nutrient total actually covers.
  function dayTotals(day) {
    const t = {};
    NUTRIENT_KEYS.forEach(k => { t[k] = 0; });
    const known = {}; NUTRIENT_KEYS.forEach(k => { known[k] = 0; });
    const micros = {}, microKnown = {};
    let items = 0;
    (day ? (day.meals || []) : []).forEach(m => {
      const q = m.qty || 1;
      items++;
      NUTRIENT_KEYS.forEach(k => {
        const v = m[k];
        if (v === null || v === undefined || v === "") { if (k === "calories" || k === "protein" || k === "carbs" || k === "fat") known[k]++; return; }
        t[k] += Number(v) * q; known[k]++;
      });
      const mm = m.micros || {};
      Object.keys(mm).forEach(k => { if (mm[k] != null) { micros[k] = (micros[k] || 0) + mm[k] * q; microKnown[k] = (microKnown[k] || 0) + 1; } });
    });
    NUTRIENT_KEYS.forEach(k => { t[k] = Math.round(t[k] * 10) / 10; });
    Object.keys(micros).forEach(k => { micros[k] = Math.round(micros[k] * 100) / 100; });
    t.items = items; t.known = known; t.micros = micros; t.microKnown = microKnown;
    return t;
  }
  // Fraction of logged items where a nutrient was known (1 = complete).
  function coverage(t, k) { return t.items ? (t.known[k] || 0) / t.items : 0; }

  // ---- Carb quality & sodium (fiber, sugar, salt) ----
  const SODIUM_LIMIT_MG = 2300;            // general adult ceiling; heavy sweaters can need more
  function fiberTarget(calories) { return Math.round(14 * (calories || 2000) / 1000); } // 14 g per 1,000 kcal
  function saltFromSodium(mg) { return Math.round((mg || 0) * 2.5 / 100) / 10; }       // g salt
  function qualityAccumulator() {
    const keys = ["fiber","fiberSol","fiberInsol","sugar","addedSugar","sodium","potassium","satFat"];
    const sum = {}, known = {}; let items = 0;
    return {
      add(t) { items += t.items; keys.forEach(k => { sum[k] = (sum[k] || 0) + (t[k] || 0); known[k] = (known[k] || 0) + (t.known[k] || 0); }); },
      result(days) {
        const out = { items };
        keys.forEach(k => { out[k] = days ? Math.round((sum[k] || 0) / days * 10) / 10 : 0; out[k + "Cov"] = items ? (known[k] || 0) / items : 0; });
        return out;
      }
    };
  }
  const covNote = (c) => c < 0.95 ? "from " + Math.round(c * 100) + "% of items" : null;
  function QualityGrid({ quality, targets, title }) {
    const q = quality;
    if (!q || !q.items) return null;
    const ft = fiberTarget(targets && targets.calories);
    const sodiumHigh = q.sodium > SODIUM_LIMIT_MG;
    const cell = (label, value, sub, note, pct, cls) => h("div", { className: "macro-cell" },
      h("div", { className: "l" }, label),
      h("div", { className: "v" }, value),
      h("div", { className: "t" }, sub),
      note && h("div", { className: "t", style: { opacity: 0.8 } }, note),
      pct != null && h("div", { className: "pbar " + (cls || "calories") }, h("div", { style: { width: Math.min(100, pct) + "%", background: cls === "warn" ? "var(--danger)" : undefined } })));
    const showSplit = q.fiberSolCov >= 0.5;
    return h("div", null,
      title && h("div", { style: { fontSize: 13, fontWeight: 600, margin: "14px 0 6px" } }, title),
      h("div", { className: "macro-grid", style: { marginTop: title ? 0 : 8 } },
        cell("Avg fiber", q.fiber + "g", "target " + ft + "g", covNote(q.fiberCov), (q.fiber / ft) * 100, "carbs"),
        cell("Avg sugar", q.sugar + "g", "total sugar", covNote(q.sugarCov), null),
        cell("Avg sodium", Math.round(q.sodium).toLocaleString() + "mg", "≈ " + saltFromSodium(q.sodium) + "g salt", covNote(q.sodiumCov),
             (q.sodium / SODIUM_LIMIT_MG) * 100, sodiumHigh ? "warn" : "protein")
      ),
      showSplit && h("div", { style: { fontSize: 12, color: "var(--muted)", marginTop: 6 } },
        "Fiber split: soluble " + q.fiberSol + "g · insoluble " + q.fiberInsol + "g" + (q.fiberSolCov < 0.95 ? " (from " + Math.round(q.fiberSolCov * 100) + "% of items)" : "")),
      h("div", { style: { fontSize: 11.5, color: "var(--muted)", marginTop: 4 } },
        "Sodium limit " + SODIUM_LIMIT_MG.toLocaleString() + "mg/day (≈ 5.8g salt)" + (sodiumHigh ? " — you're above it on average." : "."))
    );
  }
  function dayBurn(day) {
    if (!day) return 0;
    return (day.workouts || []).reduce((s,w) => s + (w.calories||0), 0);
  }

  function Icon(name, size) {
    size = size || 22;
    return h("svg", {
      width: size, height: size, viewBox: "0 0 24 24",

  /* ---------- Toast ---------- */
  const ToastCtx = React.createContext(null);
  function ToastProvider({ children }) {
    const [msg, setMsg] = useState(null);
    const tref = useRef();
    const show = useCallback((m) => {
      setMsg(m);
      clearTimeout(tref.current);
      tref.current = setTimeout(() => setMsg(null), 2400);
    }, []);
    return h(ToastCtx.Provider, { value: show },
      children,
      msg && h("div", { className: "toast show" }, msg)
    );
  }
  const useToast = () => React.useContext(ToastCtx);

  /* ---------- Sheet ---------- */
  function Sheet({ open, onClose, title, children }) {
    useEffect(() => {
      if (!open) return;
      const onKey = (e) => { if (e.key === "Escape") onClose(); };
      window.addEventListener("keydown", onKey);
      document.body.style.overflow = "hidden";
      return () => {
        window.removeEventListener("keydown", onKey);
        document.body.style.overflow = "";
      };
    }, [open, onClose]);
    return h(React.Fragment, null,
      h("div", { className: "sheet-bg" + (open ? " open" : ""), onClick: onClose }),
      h("div", { className: "sheet" + (open ? " open" : ""), onClick: (e) => e.stopPropagation() },

        ),

  }

  /* ---------- Dashboard ---------- */
  function MacroRing({ consumed, target }) {
    const pct = Math.min(100, target ? (consumed/target)*100 : 0);
    const size = 160, stroke = 14, r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const dash = (pct/100) * c;
    return h("div", { className: "macro-ring", style: { width: size, height: size } },
      h("svg", { width: size, height: size, viewBox: "0 0 " + size + " " + size, style: { transform: "rotate(-90deg)" } },
        h("circle", { cx: size/2, cy: size/2, r, stroke: "var(--border)", strokeWidth: stroke, fill: "none" }),
        h("circle", { cx: size/2, cy: size/2, r, stroke: "var(--primary)", strokeWidth: stroke, fill: "none", strokeDasharray: c, strokeDashoffset: c - dash, strokeLinecap: "round", style: { transition: "stroke-dashoffset 0.5s" } })
      ),

        h("div", { className: "big" }, Math.round(consumed)),

      )

  }

  function ringColorFor(pct) {
    if (pct >= 90 && pct <= 115) return "var(--success)";

    return "var(--muted-soft)";
  }

  function WeeklyAdherence({ data }) {
    const today = todayKey();
    const targets = computeTargets(data.profile);
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const key = shift(today, -i);
      const d = data.days[key];
      const t = dayTotals(d);
      const pct = targets.calories ? (t.calories / targets.calories) * 100 : 0;
      const [y,m,dd] = key.split("-").map(Number);
      const lbl = ["S","M","T","W","T","F","S"][new Date(y, m-1, dd).getDay()];
      days.push({ key, lbl, logged: t.calories > 0, hit: t.calories > 0 && pct >= 85 && pct <= 115, over: t.calories > 0 && pct > 115, isToday: key === today });
    }
    const hitCount = days.filter(d => d.hit).length;
    return h("div", { className: "card" },
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
        h("h2", { style: { margin: 0 } }, "7-day adherence"),

    );
  }

        ),
        h("div", { className: "qstat" },
          h("div", { className: "l" }, "Net"),
          h("div", { className: "v" }, Math.round(totals.calories - burn)),
          h("div", { className: "delta " + (totals.calories - burn <= targets.calories ? "pos" : "neg") },
            Math.abs(targets.calories - (totals.calories - burn)) + " " + ((totals.calories - burn) <= targets.calories ? "below" : "over"))
        ),
        h("div", { className: "qstat" },
          h("div", { className: "l" }, "Workouts"),
          h("div", { className: "v" }, (day && day.workouts || []).length),
          h("div", { className: "delta" }, "sessions")
        )
      ),

      // Protein progress (emphasized for muscle goal)
      h("div", { className: "card" },
        h("h2", null, "Protein for muscle"),
        h("div", { style: { display: "flex", alignItems: "baseline", justifyContent: "space-between" } },
          h("div", { style: { fontSize: 28, fontWeight: 700 } }, Math.round(totals.protein) + "g"),
          h("div", { className: "pill " + (totals.protein >= targets.protein ? "pos" : "") },
            Math.round((totals.protein / targets.protein) * 100) + "% of " + targets.protein + "g target")
        ),
        h("div", { className: "pbar protein" }, h("div", { style: { width: Math.min(100, (totals.protein/targets.protein)*100) + "%" } })),
        h("div", { style: { fontSize: 12, color: "var(--muted)", marginTop: 8 } },
          totals.protein >= targets.protein
            ? "Target hit. Excellent for muscle protein synthesis."
            : "Need " + Math.max(0, Math.round(targets.protein - totals.protein)) + "g more today."
        )
      ),

      // Daily check-in: weight + sleep for the selected day, with a 14-day mini trend
      h(DailyCheckInCard, { data, activeDate, onOpen: openCheckIn }),

      // Today's workout summary
      day && day.workouts && day.workouts.length > 0 && h("div", { className: "card" },
        h("h2", null, "Today's workouts"),
        day.workouts.map(w =>
          h("div", { key: w.id, style: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: "1px solid var(--border-soft)" } },
            h("div", null,
              h("div", { style: { fontWeight: 500 } }, w.name),
              h("div", { style: { fontSize: 12, color: "var(--muted)" } },
                w.type === "strength"
                  ? ((w.sets || []).length + " sets")
                  : (w.minutes + " min" + (w.distanceKm ? " · " + w.distanceKm + " km" : "")))
            ),
            h("div", { style: { fontSize: 13, fontWeight: 600 } }, w.calories + " kcal")
          )
        )
      )
    );
  }

  function greeting() {
    const hr = new Date().getHours();
    if (hr < 12) return "Good morning";
    if (hr < 17) return "Good afternoon";
    return "Good evening";
  }

  function macroCell(label, val, target, unit, cls) {
    const pct = target ? Math.min(100, (val/target)*100) : 0;
    return h("div", { className: "macro-cell", key: label },
      h("div", { className: "l" }, label),
      h("div", { className: "v" }, Math.round(val) + unit),
      h("div", { className: "t" }, "of " + Math.round(target) + unit),
      h("div", { className: "pbar " + cls }, h("div", { style: { width: pct + "%" } }))
    );
  }

  /* ---------- Weight + sleep helpers ---------- */
  function upsertDated(log, entry) {
    const out = (log || []).filter(x => x.date !== entry.date);
    out.push(entry);
    return out.sort((a, b) => a.date.localeCompare(b.date));
  }
  function entryOn(log, key) { return (log || []).find(x => x.date === key) || null; }
  function fmtSleep(hours) {
    if (hours == null || !isFinite(hours)) return "—";
    const m = Math.round(hours * 60);
    return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m";
  }
  function fmtShortDate(key) {
    const [y, m, d] = key.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function fmtKg(v) { return (Math.round(v * 10) / 10).toFixed(1) + " kg"; }
  function fmtSignedKg(v) { const r = Math.round(v * 10) / 10; return (r > 0 ? "+" : r < 0 ? "−" : "±") + Math.abs(r).toFixed(1) + " kg"; }
  function logInRange(log, startKey, endKey, valueOf) {
    return (log || []).filter(x => x.date >= startKey && x.date <= endKey)
      .sort((a, b) => a.date.localeCompare(b.date))
      .map(x => ({ date: x.date, v: valueOf(x) }))
      .filter(p => isFinite(p.v));
  }
  function mean(arr) { return arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : null; }

  function MiniTrend({ points, startKey, endKey, color, fill }) {
    const w = 320, ht = 80, pad = 8;
    const vals = points.map(p => p.v);
    const spread = Math.max(...vals) - Math.min(...vals);
    const minV = Math.min(...vals) - Math.max(0.3, spread * 0.15);
    const maxV = Math.max(...vals) + Math.max(0.3, spread * 0.15);
    const range = maxV - minV || 1;
    const total = Math.max(1, daysBetween(startKey, endKey));
    const pts = points.map(p => {
      const x = pad + (daysBetween(startKey, p.date) / total) * (w - pad * 2);
      const y = ht - pad - ((p.v - minV) / range) * (ht - pad * 2);
      return [x, y];
    });
    const d = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    return h("div", { className: "trend" },
      h("svg", { viewBox: "0 0 " + w + " " + ht, preserveAspectRatio: "none", "aria-hidden": "true" },
        h("path", { d: d + " L" + pts[pts.length-1][0] + "," + (ht-pad) + " L" + pts[0][0] + "," + (ht-pad) + " Z", fill }),
        h("path", { d, stroke: color, strokeWidth: 2, fill: "none", strokeLinecap: "round", strokeLinejoin: "round", vectorEffect: "non-scaling-stroke" }),
        pts.map((p, i) => h("circle", { key: i, cx: p[0], cy: p[1], r: 2.5, fill: color }))
      )
    );
  }

  function DailyCheckInCard({ data, activeDate, onOpen }) {
    const [mode, setMode] = useState("weight");
    const isToday = activeDate === todayKey();
    const weightLog = useMemo(() => (data.weightLog || []).slice().sort((a, b) => a.date.localeCompare(b.date)), [data.weightLog]);
    const sleepLog = data.sleepLog || [];
    const w = entryOn(weightLog, activeDate);
    const sl = entryOn(sleepLog, activeDate);
    const prevW = weightLog.filter(x => x.date < activeDate).slice(-1)[0];
    const start14 = shift(activeDate, -13);
    const wPts = logInRange(weightLog, start14, activeDate, x => Number(x.kg));
    const sPts = logInRange(sleepLog, start14, activeDate, x => Number(x.hours));
    const week = sPts.filter(p => p.date > shift(activeDate, -7));
    const sleepAvg7 = week.length >= 2 ? mean(week.map(p => p.v)) : null;
    const pts = mode === "weight" ? wPts : sPts;
    const loggedCount = (w ? 1 : 0) + (sl ? 1 : 0);

    const tile = (done, icon, label, value, sub) =>
      h("button", { className: "checkin-tile" + (done ? " done" : ""), onClick: onOpen, "aria-label": (done ? "Edit " : "Log ") + label.toLowerCase() },
        h("div", { className: "l" }, Icon(icon, 14), label),
        h("div", { className: "v" + (done ? "" : " empty") }, value),
        h("div", { className: "s" }, sub)
      );

    return h("div", { className: "card" },
      h("div", { className: "row-between" },
        h("h2", { style: { margin: 0 } }, "Daily check-in"),
        h("span", { className: "pill" + (loggedCount === 2 ? " pos" : "") },
          loggedCount === 2 ? "Done" : loggedCount === 1 ? "1 of 2 logged" : (isToday ? "Not logged yet" : "Not logged"))
      ),
      h("div", { className: "checkin-grid" },
        tile(!!w, "weight", "Weight",
          w ? fmtKg(Number(w.kg)) : "+ Add weight",
          w ? (prevW ? fmtSignedKg(w.kg - prevW.kg) + " vs " + fmtShortDate(prevW.date) : "First weigh-in") : (isToday ? "Morning weigh-in" : fmtDate(activeDate))),
        tile(!!sl, "moon", "Sleep",
          sl ? fmtSleep(Number(sl.hours)) : "+ Add sleep",
          sl ? (sleepAvg7 != null ? "7-day avg " + fmtSleep(sleepAvg7) : "Night before") : (isToday ? "Last night" : "Night before"))
      ),
      h("div", { className: "row-between mini-head" },
        h("span", { className: "lbl" }, "Last 14 days"),
        h("div", { className: "range-select sm", role: "tablist" },
          [["weight", "Weight"], ["sleep", "Sleep"]].map(([id, lbl]) =>
            h("button", { key: id, role: "tab", "aria-selected": mode === id, className: mode === id ? "active" : "", onClick: () => setMode(id) }, lbl))
        )
      ),
      pts.length >= 2
        ? h(MiniTrend, { points: pts, startKey: start14, endKey: activeDate,
            color: mode === "weight" ? "var(--primary)" : "var(--violet)",
            fill: mode === "weight" ? "var(--primary-soft)" : "var(--violet-soft)" })
        : h("div", { className: "mini-empty" }, "Log " + (mode === "weight" ? "your weight" : "sleep") + " on two or more days to see the trend."),
      pts.length >= 2 && h("div", { className: "trend-stats" },
        mode === "weight"
          ? [h("div", { key: "a" }, "Change: ", h("b", null, fmtSignedKg(pts[pts.length-1].v - pts[0].v))),
             h("div", { key: "b" }, "Weigh-ins: ", h("b", null, pts.length + "/14"))]
          : [h("div", { key: "a" }, "Average: ", h("b", null, fmtSleep(mean(pts.map(p => p.v))))),
             h("div", { key: "b" }, "Nights: ", h("b", null, pts.length + "/14"))]
      ),
      h("button", { className: loggedCount === 2 ? "btn secondary" : "btn", onClick: onOpen, style: { marginTop: 8 } },
        loggedCount === 2 ? "Edit check-in" : isToday ? "Log weight & sleep" : "Log weight & sleep for " + fmtDate(activeDate))
    );
  }

  /* ---------- Meals ---------- */
  const MEAL_SLOTS = [
    { id: "breakfast", name: "Breakfast", emoji: "🌅" },
    { id: "lunch", name: "Lunch", emoji: "🍽️" },
    { id: "dinner", name: "Dinner", emoji: "🌙" },
    { id: "snacks", name: "Snacks", emoji: "🥪" }
  ];

  function MealsTab({ data, setData, activeDate, setActiveDate, openAddMeal, openDietPlan, openSheet }) {
    const day = data.days[activeDate] || { meals: [], workouts: [] };
    const totals = dayTotals(day);
    const targets = computeTargets(data.profile);

    const removeDietPlan = () => {
      if (!confirm("Remove your diet plan and go back to auto-calculated targets?")) return;
      setData({ ...data, dietPlan: null, profile: { ...data.profile, customCalories: null, customMacros: null } });
    };

    return h("div", null,
      h("div", { className: "header" },
        h("div", null,
          h("h1", null, "Meals"),
          h("div", { className: "sub" }, Math.round(totals.calories) + " of " + targets.calories + " kcal")
        )
      ),
      h(DietPlanCard, { data, onOpenUpload: openDietPlan, onRemove: removeDietPlan }),
      h("div", { className: "date-nav" },
        h("button", { className: "nav-btn", onClick: () => setActiveDate(shift(activeDate, -1)) }, Icon("chevronL", 18)),
        h("div", { className: "date" }, fmtDate(activeDate)),
        h("button", { className: "nav-btn", onClick: () => setActiveDate(shift(activeDate, 1)), disabled: activeDate >= todayKey() }, Icon("chevron", 18))
      ),
      (totals.items > 0 || ((day.supplements || []).length > 0)) && h(DayQualityStrip, { totals, targets, onOpen: () => openSheet && openSheet("day-nutrients") }),
      (totals.items > 0 || ((day.supplements || []).length > 0)) && h(GapsSummary, { data, dateKey: activeDate, compact: true, onOpen: () => openSheet && openSheet("day-nutrients") }),
      h(WaterCard, { data, setData, activeDate, targets: nutrientTargets(data.profile, targets.calories) }),
      MEAL_SLOTS.map(slot => {
        const items = (day.meals || []).filter(m => m.slot === slot.id);
        const slotTotals = items.reduce((s, m) => {
          const q = m.qty || 1;
          return { cal: s.cal + (m.calories||0)*q, p: s.p + (m.protein||0)*q };
        }, { cal: 0, p: 0 });
        return h("div", { key: slot.id, className: "meal-block" },
          h("div", { className: "meal-head" },
            h("div", null,
              h("div", { className: "t" }, slot.emoji + " " + slot.name),
              h("div", { className: "s" },
                items.length > 0
                  ? Math.round(slotTotals.cal) + " kcal · " + Math.round(slotTotals.p) + "g protein"
                  : "Nothing logged"
              )
            ),
            h("button", { className: "add-btn", onClick: () => openAddMeal(slot.id), "aria-label": "Add to " + slot.name }, "+")
          ),
          items.length === 0
            ? null
            : items.map(item => h(FoodRow, {
                key: item.id,
                item,
                onDelete: () => {
                  const next = { ...data };
                  const d = ensureDay(next.days, activeDate);
                  d.meals = d.meals.filter(m => m.id !== item.id);
                  setData(next);
                },
                onEdit: (updated) => {
                  const next = { ...data };
                  const d = ensureDay(next.days, activeDate);
                  d.meals = d.meals.map(m => m.id === item.id ? { ...m, ...updated } : m);
                  setData(next);
                }
              }))
        );
      }),
      h(SupplementsCard, { data, setData, activeDate, onManage: () => openSheet && openSheet("supplements") })
    );
  }

  /* ================= Phase 3: targets, water, supplements ================= */

  // Display info for every tracked nutrient. kind: "min" = aim to reach, "max" = stay under, "guide" = loose guideline.
  const NUTRIENT_INFO = {
    protein: { label: "Protein", unit: "g", group: "Macros", kind: "min" },
    fiber: { label: "Fiber", unit: "g", group: "Carbs & fats", kind: "min" },
    fiberSol: { label: "Soluble fiber", unit: "g", group: "Carbs & fats" },
    fiberInsol: { label: "Insoluble fiber", unit: "g", group: "Carbs & fats" },
    sugar: { label: "Sugar (total)", unit: "g", group: "Carbs & fats" },
    addedSugar: { label: "Added sugar", unit: "g", group: "Carbs & fats", kind: "max" },
    satFat: { label: "Saturated fat", unit: "g", group: "Carbs & fats", kind: "max" },
    sodium: { label: "Sodium", unit: "mg", group: "Electrolytes", kind: "max" },
    potassium: { label: "Potassium", unit: "mg", group: "Electrolytes", kind: "min" },
    ca: { label: "Calcium", unit: "mg", group: "Minerals", kind: "min" },
    fe: { label: "Iron", unit: "mg", group: "Minerals", kind: "min" },
    mg: { label: "Magnesium", unit: "mg", group: "Minerals", kind: "min" },
    zn: { label: "Zinc", unit: "mg", group: "Minerals", kind: "min" },
    p: { label: "Phosphorus", unit: "mg", group: "Minerals", kind: "min" },
    se: { label: "Selenium", unit: "µg", group: "Minerals", kind: "min" },
    vitA: { label: "Vitamin A", unit: "µg RAE", group: "Vitamins", kind: "min" },
    vitC: { label: "Vitamin C", unit: "mg", group: "Vitamins", kind: "min" },
    vitD: { label: "Vitamin D", unit: "µg", group: "Vitamins", kind: "min" },
    vitE: { label: "Vitamin E", unit: "mg", group: "Vitamins", kind: "min" },
    vitK: { label: "Vitamin K", unit: "µg", group: "Vitamins", kind: "min" },
    folate: { label: "Folate", unit: "µg DFE", group: "Vitamins", kind: "min" },
    b12: { label: "Vitamin B12", unit: "µg", group: "Vitamins", kind: "min" },
    ala: { label: "Omega-3 ALA", unit: "g", group: "Omega-3", kind: "min" },
    epadha: { label: "Omega-3 EPA + DHA", unit: "mg", group: "Omega-3", kind: "guide" }
  };
  const NUTRIENT_ORDER = Object.keys(NUTRIENT_INFO);
  const NUTRIENT_GROUPS = ["Macros", "Carbs & fats", "Electrolytes", "Minerals", "Vitamins", "Omega-3"];

  /* Daily targets by sex and age (US Dietary Reference Intakes for adults; fiber / sat fat / added sugar
     scale with your calorie target). ul = tolerable upper limit; ulScope says what it applies to:
     "total" = food + supplements, "supp" = supplements only, "folicAcid" = synthetic folic acid only,
     "retinol" = preformed vitamin A from supplements. Any value can be overridden in Settings. */
  function nutrientTargets(profile, calories) {
    const male = (profile && profile.sex) !== "female";
    const age = Number(profile && profile.age) || 30;
    const cal = calories || 2000;
    const t = {
      protein: { v: computeTargets(profile).protein, note: "from your nutrition goal" },
      fiber: { v: Math.round(14 * cal / 1000), note: "14 g per 1,000 kcal" },
      addedSugar: { v: Math.round(cal * 0.05 / 4), note: "5% of calories" },
      satFat: { v: Math.round(cal * 0.10 / 9), note: "10% of calories" },
      sodium: { v: 2300, note: "heavy sweating in training raises real needs" },
      potassium: { v: male ? 3400 : 2600 },
      ca: { v: (!male && age > 50) || (male && age > 70) ? 1200 : 1000, ul: age > 50 ? 2000 : 2500, ulScope: "total" },
      fe: { v: male ? 8 : (age <= 50 ? 18 : 8), ul: 45, ulScope: "total" },
      mg: { v: male ? (age <= 30 ? 400 : 420) : (age <= 30 ? 310 : 320), ul: 350, ulScope: "supp" },
      zn: { v: male ? 11 : 8, ul: 40, ulScope: "total" },
      p: { v: 700, ul: 4000, ulScope: "total" },
      se: { v: 55, ul: 400, ulScope: "total" },
      vitA: { v: male ? 900 : 700, ul: 3000, ulScope: "retinol" },
      vitC: { v: male ? 90 : 75, ul: 2000, ulScope: "total" },
      vitD: { v: age > 70 ? 20 : 15, ul: 100, ulScope: "total", note: "food alone is usually low; sun and supplements count most" },
      vitE: { v: 15, ul: 1000, ulScope: "supp" },
      vitK: { v: male ? 120 : 90 },
      folate: { v: 400, ul: 1000, ulScope: "folicAcid" },
      b12: { v: 2.4 },
      ala: { v: male ? 1.6 : 1.1 },
      epadha: { v: 500, note: "guideline 250–500 mg; no official target" },
      water: { v: male ? 3000 : 2200, note: "from drinks; +500 ml on training days" }
    };
    const over = (profile && profile.nutrientTargets) || {};
    Object.keys(over).forEach(k => {
      const v = numOrNull(over[k]);
      if (v !== null && t[k]) { t[k] = { ...t[k], v, custom: true }; }
    });
    return t;
  }

  /* ---- Supplements ----
     data.supplements: library [{ id, name, brand, barcode, serving, timing, kind: "nutrient" | "adherence",
       nutr: { calories, protein, sodium, potassium, micros: {...}, folicAcid, vitARetinol }, verified, source, archived }]
     day.supplements: [{ id, suppId, name, doses, time, nutr }] — nutr is a snapshot so later edits don't rewrite history. */
  const SUPP_TIMINGS = [
    { id: "morning", label: "Morning" }, { id: "preworkout", label: "Pre-workout" }, { id: "postworkout", label: "Post-workout" },
    { id: "lunch", label: "With lunch" }, { id: "dinner", label: "With dinner" }, { id: "bedtime", label: "Bedtime" }, { id: "any", label: "Any time" }
  ];
  const timingLabel = (id) => (SUPP_TIMINGS.find(t => t.id === id) || SUPP_TIMINGS[6]).label;

  function daySuppTotals(day) {
    const out = { micros: {}, folicAcid: 0, vitARetinol: 0, calories: 0, protein: 0, sodium: 0, potassium: 0, taken: 0 };
    ((day && day.supplements) || []).forEach(e => {
      const d = Number(e.doses) || 0;
      if (!d) return;
      out.taken++;
      const n = e.nutr || {};
      ["calories", "protein", "sodium", "potassium", "folicAcid", "vitARetinol"].forEach(k => { if (n[k]) out[k] += n[k] * d; });
      Object.keys(n.micros || {}).forEach(k => { out.micros[k] = (out.micros[k] || 0) + n.micros[k] * d; });
    });
    return out;
  }

  // Food + supplement view of one day, per nutrient: { food, supp, total, cov }
  function dayNutrients(day) {
    const t = dayTotals(day);
    const s = daySuppTotals(day);
    const out = {};
    NUTRIENT_ORDER.forEach(k => {
      let food = null, cov = 0;
      if (k === "epadha") {
        const e = t.micros.epa, d = t.micros.dha;
        food = (e == null && d == null) ? null : (e || 0) + (d || 0);
        cov = t.items ? Math.min(t.microKnown.epa || 0, t.microKnown.dha || 0) / t.items : 0;
      } else if (NUTRIENT_KEYS.indexOf(k) >= 0) {
        food = t.items && t.known[k] ? t[k] : null;
        cov = t.items ? (t.known[k] || 0) / t.items : 0;
      } else {
        food = t.micros[k] != null ? t.micros[k] : null;
        cov = t.items ? (t.microKnown[k] || 0) / t.items : 0;
      }
      let supp = 0;
      if (k === "epadha") supp = (s.micros.epa || 0) + (s.micros.dha || 0);
      else if (k === "sodium" || k === "potassium") supp = s[k] || 0;
      else supp = s.micros[k] || 0;
      const total = (food == null && !supp) ? null : (food || 0) + supp;
      out[k] = { food, supp, total, cov };
    });
    out._supp = s; out._totals = t;
    return out;
  }

  // Which upper limits are exceeded today (respecting what each limit applies to).
  function upperLimitIssues(dn, targets) {
    const issues = {};
    NUTRIENT_ORDER.forEach(k => {
      const tg = targets[k];
      if (!tg || !tg.ul) return;
      let amount = 0;
      if (tg.ulScope === "total") amount = dn[k].total || 0;
      else if (tg.ulScope === "supp") amount = dn[k].supp || 0;
      else if (tg.ulScope === "folicAcid") amount = dn._supp.folicAcid || 0;
      else if (tg.ulScope === "retinol") amount = dn._supp.vitARetinol || 0;
      if (amount > tg.ul) issues[k] = { amount, ul: tg.ul, scope: tg.ulScope };
    });
    return issues;
  }

  function waterTarget(targets, day) {
    const trained = ((day && day.workouts) || []).length > 0;
    return targets.water.v + (trained ? 500 : 0);
  }

  // Adherence for one supplement over the last n days (ending at endKey).
  function suppAdherence(data, suppId, n, endKey) {
    let taken = 0, streak = 0, streakOpen = true;
    for (let i = 0; i < n; i++) {
      const k = shift(endKey, -i);
      const ok = (((data.days[k] || {}).supplements) || []).some(e => e.suppId === suppId && Number(e.doses) > 0);
      if (ok) taken++;
      if (streakOpen) { if (ok) streak++; else if (i > 0) streakOpen = false; }
    }
    return { taken, n, streak };
  }

  /* ---- Barcode lookup for supplements: your own library first, then Open Food Facts ---- */
  const OFF_SUPP_MAP = { // OFF key -> [our key, factor from grams]
    "vitamin-d": ["vitD", 1e6], "vitamin-b12": ["b12", 1e6], "vitamin-b9": ["folate", 1e6], "folates": ["folate", 1e6],
    "vitamin-c": ["vitC", 1e3], "vitamin-a": ["vitA", 1e6], "vitamin-e": ["vitE", 1e3], "vitamin-k": ["vitK", 1e6],
    "calcium": ["ca", 1e3], "iron": ["fe", 1e3], "magnesium": ["mg", 1e3], "zinc": ["zn", 1e3], "selenium": ["se", 1e6],
    "potassium": ["potassium", 1e3], "sodium": ["sodium", 1e3], "eicosapentaenoic-acid": ["epa", 1e3],
    "docosahexaenoic-acid": ["dha", 1e3], "alpha-linolenic-acid": ["ala", 1]
  };
  async function lookupSupplementBarcode(code, library) {
    const hit = (library || []).find(s => s.barcode && s.barcode === code);
    if (hit) return { existing: hit };
    const draft = { barcode: code, name: "", brand: "", serving: "1 tablet", kind: "nutrient", vals: {}, source: "manual", scanNote: "" };
    try {
      const url = "https://world.openfoodfacts.org/api/v2/product/" + encodeURIComponent(code) +
        "?fields=product_name,brands,nutriments,serving_size";
      const r = await fetch(url);
      const j = r.ok ? await r.json() : null;
      const p = j && j.status !== 0 ? j.product : null;
      if (p) {
        const n = p.nutriments || {};
        draft.name = p.product_name || "";
        draft.brand = p.brands || "";
        if (p.serving_size) draft.serving = p.serving_size;
        const servG = Number((String(p.serving_size || "").match(/(\d+(?:\.\d+)?)\s*g\b/) || [])[1]) || null;
        let found = 0;
        Object.keys(OFF_SUPP_MAP).forEach(key => {
          const [ours, f] = OFF_SUPP_MAP[key];
          let v = numOrNull(n[key + "_serving"]);
          if (v === null && servG) { const p100 = numOrNull(n[key + "_100g"]); if (p100 !== null) v = p100 * servG / 100; }
          if (v === null) return;
          draft.vals[ours] = String(Math.round(v * f * 1000) / 1000);
          found++;
        });
        const kcal = numOrNull(n["energy-kcal_serving"]); if (kcal) draft.vals.calories = String(kcal);
        const prot = numOrNull(n["proteins_serving"]); if (prot) draft.vals.protein = String(prot);
        draft.source = "off";
        draft.scanNote = found
          ? "Found on Open Food Facts with " + found + " nutrient value" + (found > 1 ? "s" : "") + ". Check each one against the label before saving."
          : "Found the product name on Open Food Facts, but no nutrient values. Enter them from the label.";
      } else {
        draft.scanNote = "This barcode isn't in Open Food Facts. Enter the details from the label — next time this barcode is recognised instantly.";
      }
    } catch (e) {
      draft.scanNote = "Couldn't reach Open Food Facts (offline?). Enter the details from the label.";
    }
    return { draft };
  }

      : h("div", null,
          h(GapsSummary, { data, dateKey: activeDate }),
          h("div", { style: { fontSize: 12, color: "var(--muted)", marginBottom: 6 } },
            "Tap a nutrient for foods high in it. " + t.items + " food item" + (t.items === 1 ? "" : "s") + " · " + s.taken + " supplement" + (s.taken === 1 ? "" : "s") +
            ". Built-in foods report most nutrients; online and older entries often only report macros. Vitamin B12 and added sugar aren't in the Indian food tables, so they mostly come from labels and supplements."),
          NUTRIENT_GROUPS.map(g => h("div", { key: g, style: { marginTop: 12 } },
            h("div", { style: { fontSize: 13, fontWeight: 700, marginBottom: 2 } }, g),
            NUTRIENT_ORDER.filter(k => NUTRIENT_INFO[k].group === g).map(row)))));
  }

  /* ---- UI: nutrient target overrides (Settings) ---- */
  function NutrientTargetsSheet({ open, onClose, data, setData }) {
    const [vals, setVals] = useState({});
    useEffect(() => { if (open) setVals({ ...(data.profile.nutrientTargets || {}) }); }, [open]);
    const base = nutrientTargets({ ...data.profile, nutrientTargets: {} }, computeTargets(data.profile).calories);
    const toast = useToast();
    const save = () => {
      const clean = {};
      Object.keys(vals).forEach(k => { const v = numOrNull(vals[k]); if (v !== null) clean[k] = v; });
      setData({ ...data, profile: { ...data.profile, nutrientTargets: clean } });
      toast("Saved"); onClose();
    };
    const keys = [...NUTRIENT_ORDER.filter(k => base[k] && k !== "protein"), "water"]; // protein is set in the nutrition goal
    return h(Sheet, { open, onClose, title: "Nutrient targets" },
      h("div", { style: { fontSize: 12.5, color: "var(--muted)", marginBottom: 10 } },
        "Defaults come from your sex (" + (data.profile.sex === "female" ? "female" : "male") + "), age (" + data.profile.age + ") and calorie target. Type a number to override; clear it to go back to the default."),
      keys.map(k => {
        const info = k === "water" ? { label: "Water (drinks)", unit: "ml", kind: "min" } : NUTRIENT_INFO[k];
        const b = base[k];
        return h("div", { key: k, className: "field-row", style: { alignItems: "center", marginTop: 6 } },
          h("div", null,
            h("div", { style: { fontSize: 13.5 } }, info.label + (info.kind === "max" ? " (max)" : "")),
            h("div", { style: { fontSize: 11.5, color: "var(--muted)" } }, "Default " + fmtAmt(b.v, info.unit) + (b.ul ? " · upper limit " + fmtAmt(b.ul, info.unit) +
              (b.ulScope === "supp" ? " from supplements" : b.ulScope === "folicAcid" ? " as folic acid" : b.ulScope === "retinol" ? " preformed" : "") : ""))),
          h("input", { className: "input", type: "number", inputMode: "decimal", placeholder: String(b.v), value: vals[k] ?? "",
            "aria-label": info.label + " target", onChange: (e) => setVals(s => ({ ...s, [k]: e.target.value })) }));
      }),
      h("button", { className: "btn", style: { marginTop: 14 }, onClick: save }, "Save"));
  }

  /* ================= Phase 5: nutrient stats over a period ================= */

  const ANIMAL_CATS = new Set(["Eggs", "Meat & poultry (raw)", "Fish & seafood (raw)", "Chicken, fish & meat"]);
  const ANIMAL_RE = /\b(chicken|murg|fish|machli|egg|eggs|anda|omelette|mutton|goat|prawn|kolambi|surmai|pomfret|paplet|rohu|keema|meat|tuna|salmon)\b/i;
  function isAnimalMeal(m) { return ANIMAL_CATS.has(m.cat) || ANIMAL_RE.test(String(m.name || "")); }

  // Per-meal amount of nutrient k (handles flat keys, micros and the EPA+DHA composite).
  function mealAmount(m, k) {
    const q = m.qty || 1;
    if (k === "epadha") {
      const e = m.micros && m.micros.epa, d = m.micros && m.micros.dha;
      return (e == null && d == null) ? null : ((e || 0) + (d || 0)) * q;
    }
    if (NUTRIENT_KEYS.indexOf(k) >= 0) { const v = m[k]; return v == null || v === "" ? null : Number(v) * q; }
    const v = m.micros && m.micros[k];
    return v == null ? null : v * q;
  }

  /* Aggregates every tracked nutrient over a list of day keys.
     Averages are over days with food logged. "Days met" = total reached the target (or stayed under it for limits). */
  function periodNutrientStats(data, keys) {
    const targetsBase = computeTargets(data.profile);
    const nt = nutrientTargets(data.profile, targetsBase.calories);
    const res = { days: 0, nutrients: {}, water: { sum: 0, days: 0, met: 0 }, split: null, supps: [], vegB12: null, ulDays: {} };
    const acc = {};
    NUTRIENT_ORDER.forEach(k => { acc[k] = { total: 0, food: 0, supp: 0, met: 0, known: 0, items: 0, sources: {} }; });
    const split = { train: { n: 0, calories: 0, protein: 0, carbs: 0, sodium: 0, water: 0, waterDays: 0 },
                    rest: { n: 0, calories: 0, protein: 0, carbs: 0, sodium: 0, water: 0, waterDays: 0 } };
    const veg = { n: 0, b12: 0 }, nonveg = { n: 0, b12: 0 };
    keys.forEach(key => {
      const day = data.days[key];
      if (!day) return;
      const meals = day.meals || [];
      const t = dayTotals(day);
      const hasFood = t.calories > 0;
      const wt = waterTarget(nt, day);
      if (Number(day.waterMl) > 0) { res.water.sum += Number(day.waterMl); res.water.days++; if (Number(day.waterMl) >= wt) res.water.met++; }
      if (!hasFood) return;
      res.days++;
      const dn = dayNutrients(day);
      const issues = upperLimitIssues(dn, nt);
      Object.keys(issues).forEach(k => { res.ulDays[k] = (res.ulDays[k] || 0) + 1; });
      NUTRIENT_ORDER.forEach(k => {
        const a = acc[k], n = dn[k], tg = nt[k];
        a.total += n.total || 0; a.food += n.food || 0; a.supp += n.supp || 0;
        a.items += t.items; a.known += Math.round(n.cov * t.items);
        if (tg && tg.v) {
          const kind = NUTRIENT_INFO[k].kind;
          if (kind === "max" ? (n.total || 0) <= tg.v : (n.total || 0) >= tg.v) a.met++;
        }
        meals.forEach(m => {
          const v = mealAmount(m, k);
          if (v) { const nm = m.name || "Unnamed"; a.sources[nm] = (a.sources[nm] || 0) + v; }
        });
        (day.supplements || []).forEach(e => {
          const d = Number(e.doses) || 0; if (!d) return;
          const nn = e.nutr || {};
          let v = 0;
          if (k === "epadha") v = ((nn.micros || {}).epa || 0) + ((nn.micros || {}).dha || 0);
          else if (k === "sodium" || k === "potassium") v = nn[k] || 0;
          else v = (nn.micros || {})[k] || 0;
          if (v) { const nm = "💊 " + (e.name || "Supplement"); a.sources[nm] = (a.sources[nm] || 0) + v * d; }
        });
      });
      const trained = (day.workouts || []).length > 0;
      const s = trained ? split.train : split.rest;
      s.n++; s.calories += t.calories; s.protein += t.protein; s.carbs += t.carbs;
      s.sodium += (dn.sodium.total || 0);
      if (Number(day.waterMl) > 0) { s.water += Number(day.waterMl); s.waterDays++; }
      const animal = meals.some(isAnimalMeal);
      const b = animal ? nonveg : veg;
      b.n++; b.b12 += dn.b12.total || 0;
    });
    const D = res.days || 1;
    NUTRIENT_ORDER.forEach(k => {
      const a = acc[k], tg = nt[k];
      const sourceList = Object.keys(a.sources).map(nm => ({ name: nm, perDay: a.sources[nm] / D, amt: a.sources[nm] }))
        .sort((x, y) => y.amt - x.amt);
      const sumSrc = sourceList.reduce((s, x) => s + x.amt, 0) || 1;
      res.nutrients[k] = {
        avg: a.total / D, avgFood: a.food / D, avgSupp: a.supp / D,
        target: tg ? tg.v : null, pct: tg && tg.v ? (a.total / D) / tg.v * 100 : null,
        met: a.met, cov: a.items ? a.known / a.items : 0,
        sources: sourceList.slice(0, 5).map(x => ({ ...x, share: x.amt / sumSrc * 100 }))
      };
    });
    const avg = (s) => s.n ? { n: s.n, calories: Math.round(s.calories / s.n), protein: Math.round(s.protein / s.n), carbs: Math.round(s.carbs / s.n),
      sodium: Math.round(s.sodium / s.n), water: s.waterDays ? Math.round(s.water / s.waterDays) : null } : { n: 0 };
    res.split = { train: avg(split.train), rest: avg(split.rest) };
    res.vegB12 = { vegDays: veg.n, vegAvg: veg.n ? veg.b12 / veg.n : null, nonvegDays: nonveg.n, nonvegAvg: nonveg.n ? nonveg.b12 / nonveg.n : null };
    res.waterAvg = res.water.days ? Math.round(res.water.sum / res.water.days) : null;
    res.waterTarget = nt.water.v;
    // Supplement adherence across the period
    res.supps = (data.supplements || []).filter(s => !s.archived).map(s => {
      let taken = 0;
      keys.forEach(k => { if ((((data.days[k] || {}).supplements) || []).some(e => e.suppId === s.id && Number(e.doses) > 0)) taken++; });
      const st = suppAdherence(data, s.id, 60, todayKey());
      return { id: s.id, name: s.name, taken, of: keys.length, pct: keys.length ? taken / keys.length * 100 : 0, streak: st.streak };
    });
    res.targets = nt;
    return res;
  }

  // Built-in dishes / whole foods richest in a nutrient per typical serving (for "where to get it" hints).
  const SUGGEST_CATS = new Set(["Sabji & curries", "Dal & pulses", "Rotis & breads", "Rice & grains", "Breakfast & snacks", "Protein dishes",
    "Chicken, fish & meat", "Sides & chutneys", "Fruits", "Nuts & seeds", "Dairy", "Eggs"]);
  function suggestFoodsFor(k, n) {
    const amt = (f) => {
      const g = f.units && f.units[0] ? f.units[0].g : (f.cat === "Nuts & seeds" ? 30 : foodBaseGrams(f)); // a handful, not 100 g
      const per = mealAmount({ ...f, qty: 1 }, k);
      return per == null ? 0 : per * g / foodBaseGrams(f);
    };
    return LOCAL_FOODS.filter(f => SUGGEST_CATS.has(f.cat) && (f.src === "recipe" || f.cat === "Fruits" || f.cat === "Nuts & seeds") && !/\b(seeds?, (black|brown|white)|cress|mustard)\b/i.test(f.name))
      .map(f => ({ f, a: amt(f) })).filter(x => x.a > 0).sort((a, b) => b.a - a.a).slice(0, n || 3).map(x => x.f.name);
  }

  /* ---- Stats UI ---- */
  function MicronutrientCard({ stats, rangeLabel }) {
    const [open, setOpen] = useState(null);
    const [showAll, setShowAll] = useState(false);
    if (!stats || !stats.days) return null;
    const keys = NUTRIENT_ORDER.filter(k => stats.nutrients[k].target);
    const rows = keys.map(k => ({ k, ...stats.nutrients[k] }))
      .sort((a, b) => {
        // limits that are exceeded and lowest-% targets first
        const sa = NUTRIENT_INFO[a.k].kind === "max" ? (a.pct > 100 ? -1 : 999) : a.pct;
        const sb = NUTRIENT_INFO[b.k].kind === "max" ? (b.pct > 100 ? -1 : 999) : b.pct;
        return sa - sb;
      });
    const visible = showAll ? rows : rows.slice(0, 8);
    return h("div", { className: "card" },
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
        h("h2", { style: { margin: 0 } }, "Vitamins, minerals & more"),
        h("div", { className: "pill" }, stats.days + " food days")),
      h("div", { style: { fontSize: 12, color: "var(--muted)", margin: "6px 0 8px" } },
        "Daily average " + rangeLabel + ", food + supplements, against your targets. Biggest gaps first — tap a row for top sources."),
      visible.map(r => {
        const info = NUTRIENT_INFO[r.k];
        const over = info.kind === "max" && r.pct > 100;
        const foodPct = r.target ? Math.min(100, r.avgFood / r.target * 100) : 0;
        const suppPct = r.target ? Math.max(0, Math.min(100 - foodPct, r.avgSupp / r.target * 100)) : 0;
        const ul = stats.ulDays[r.k];
        return h("div", { key: r.k, style: { padding: "9px 0", borderTop: "1px solid var(--border-soft)", cursor: "pointer" },
            onClick: () => setOpen(open === r.k ? null : r.k), role: "button", "aria-expanded": open === r.k },
          h("div", { style: { display: "flex", justifyContent: "space-between", gap: 8 } },
            h("div", { style: { fontSize: 13.5, fontWeight: 500 } }, info.label,
              h(StatusChip, { status: nutrientStatus(info.kind, r.avg, r.target, r.cov, r.avgSupp > 0, true) })),
            h("div", { style: { fontSize: 13, fontWeight: 600, color: over ? "var(--danger)" : undefined } },
              fmtAmt(r.avg, info.unit),
              h("span", { style: { fontWeight: 400, color: "var(--muted)" } }, (info.kind === "max" ? " / max " : " / ") + fmtAmt(r.target, info.unit)))),
          h("div", { className: "pbar", style: { display: "flex" } },
            h("div", { style: { width: foodPct + "%", background: over ? "var(--danger)" : info.kind === "max" ? "var(--protein-c)" : "var(--primary)", borderRadius: 0 } }),
            suppPct > 0 && h("div", { style: { width: suppPct + "%", background: "#b07cff", borderRadius: 0 } })),
          h("div", { style: { fontSize: 11.5, color: "var(--muted)", marginTop: 3 } },
            [Math.round(r.pct) + "%",
             (info.kind === "max" ? "under on " : "met on ") + r.met + " of " + stats.days + " days",
             r.avgSupp > 0 ? Math.round(r.avgSupp / (r.avg || 1) * 100) + "% from supplements" : null,
             r.cov < 0.8 ? "food data for " + Math.round(r.cov * 100) + "% of items" : null].filter(Boolean).join(" · ")),
          ul && h("div", { style: { fontSize: 11.5, color: "var(--danger)", marginTop: 2 } }, "Above the upper limit on " + ul + " day" + (ul > 1 ? "s" : "")),
          open === r.k && h("div", { style: { marginTop: 6, padding: "8px 10px", background: "var(--card2)", borderRadius: 8 } },
            r.sources.length ? r.sources.map((s, i) => h("div", { key: i, style: { display: "flex", justifyContent: "space-between", fontSize: 12.5, padding: "2px 0" } },
              h("span", { style: { overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", marginRight: 8 } }, s.name),
              h("span", { style: { color: "var(--muted)", whiteSpace: "nowrap" } }, fmtAmt(s.perDay, info.unit) + "/day · " + Math.round(s.share) + "%")))
            : h("div", { style: { fontSize: 12.5, color: "var(--muted)" } }, "No logged foods report this nutrient yet."),
            info.kind !== "max" && r.pct < 80 && h("div", { style: { fontSize: 11.5, color: "var(--muted)", marginTop: 6 } },
              "High in the built-in list: " + suggestFoodsFor(r.k, 3).join(", "))));
      }),
      rows.length > 8 && h("button", { className: "btn secondary", style: { marginTop: 10 }, onClick: () => setShowAll(!showAll) },
        showAll ? "Show fewer" : "Show all " + rows.length + " nutrients"),
      h("div", { style: { display: "flex", gap: 12, fontSize: 11, color: "var(--muted)", marginTop: 10 } },
        h("span", null, h("span", { style: { display: "inline-block", width: 10, height: 6, background: "var(--primary)", borderRadius: 2, marginRight: 4 } }), "food"),
        h("span", null, h("span", { style: { display: "inline-block", width: 10, height: 6, background: "#b07cff", borderRadius: 2, marginRight: 4 } }), "supplements")),
      stats.waterAvg != null && h("div", { style: { fontSize: 12.5, marginTop: 10 } },
        "💧 Water averaged " + stats.waterAvg.toLocaleString() + " ml on " + stats.water.days + " logged day" + (stats.water.days > 1 ? "s" : "") +
        " (target " + stats.waterTarget.toLocaleString() + " ml; met on " + stats.water.met + ")"));
  }

  function TrainingRestCard({ stats }) {
    if (!stats || !stats.split || !stats.split.train.n || !stats.split.rest.n) return null;
    const tr = stats.split.train, rs = stats.split.rest;
    const row = (label, a, b, unit) => h("div", { style: { display: "grid", gridTemplateColumns: "1.2fr 1fr 1fr", padding: "7px 0", borderTop: "1px solid var(--border-soft)", fontSize: 13 } },
      h("div", { style: { color: "var(--muted)" } }, label),
      h("div", { style: { fontWeight: 600 } }, a == null ? "—" : a.toLocaleString() + unit),
      h("div", { style: { fontWeight: 600 } }, b == null ? "—" : b.toLocaleString() + unit));
    return h("div", { className: "card" },
      h("h2", null, "Training vs rest days"),
      h("div", { style: { display: "grid", gridTemplateColumns: "1.2fr 1fr 1fr", fontSize: 12, color: "var(--muted)", paddingBottom: 4 } },
        h("div", null, "Daily average"), h("div", null, "Training (" + tr.n + ")"), h("div", null, "Rest (" + rs.n + ")")),
      row("Calories", tr.calories, rs.calories, " kcal"), row("Protein", tr.protein, rs.protein, " g"), row("Carbs", tr.carbs, rs.carbs, " g"),
      row("Sodium", tr.sodium, rs.sodium, " mg"), row("Water", tr.water, rs.water, " ml"),
      rs.protein < tr.protein * 0.85 && h("div", { style: { fontSize: 12, color: "var(--muted)", marginTop: 8 } },
        "Protein drops on rest days — muscle repair happens then too, so keep it close to your training-day intake."));
  }

  function SupplementAdherenceCard({ stats }) {
    if (!stats || !stats.supps.length) return null;
    return h("div", { className: "card" },
      h("h2", null, "Supplement consistency"),
      stats.supps.map(s => h("div", { key: s.id, style: { padding: "8px 0", borderTop: "1px solid var(--border-soft)" } },
        h("div", { style: { display: "flex", justifyContent: "space-between", fontSize: 13.5 } },
          h("span", null, s.name),
          h("span", { style: { fontWeight: 600 } }, s.taken + "/" + s.of + " days")),
        h("div", { className: "pbar" }, h("div", { style: { width: Math.min(100, s.pct) + "%", background: s.pct >= 85 ? "var(--success)" : s.pct >= 60 ? "var(--gold)" : "var(--danger)" } })),
        s.streak > 1 && h("div", { style: { fontSize: 11.5, color: "var(--muted)", marginTop: 3 } }, s.streak + "-day streak"))));
  }

  // Extra review insights from micronutrients, water, supplements and training/rest split.
  function micronutrientInsights(stats) {
    const out = [];
    if (!stats || !stats.days) return out;
    const N = stats.nutrients, D = stats.days;
    const nm = (k) => NUTRIENT_INFO[k].label;
    const reliable = (k) => N[k].cov >= 0.6 || N[k].avgSupp > 0;
    const strong = NUTRIENT_ORDER.filter(k => k !== "protein" && N[k].target && NUTRIENT_INFO[k].kind === "min" && reliable(k) && N[k].met / D >= 0.8);
    if (strong.length) out.push({ level: "good", text: "Hit your target most days for " + strong.slice(0, 4).map(nm).join(", ") + "." });
    const gaps = NUTRIENT_ORDER.filter(k => k !== "protein" && N[k].target && NUTRIENT_INFO[k].kind === "min" && k !== "vitD" && k !== "epadha" && reliable(k) && N[k].pct < 70)
      .sort((a, b) => N[a].pct - N[b].pct).slice(0, 3);
    gaps.forEach(k => {
      const src = N[k].sources.slice(0, 2).map(s => s.name.replace("💊 ", "")).join(" and ");
      out.push({ level: "warn", text: nm(k) + " averaged " + Math.round(N[k].pct) + "% of target (met on " + N[k].met + " of " + D + " days)" +
        (src ? "; most came from " + src : "") + ". Built-in foods high in it: " + suggestFoodsFor(k, 3).join(", ") + "." });
    });
    if (N.vitD.target && N.vitD.pct < 50) out.push({ level: "warn", text: "Vitamin D averaged " + fmtAmt(N.vitD.avg, "µg") + " a day from food and supplements. Food rarely covers it; sunlight or a supplement usually does — worth a blood test if you're unsure." });
    if (N.sodium.avg > N.sodium.target) out.push({ level: "warn", text: "Sodium averaged " + Math.round(N.sodium.avg).toLocaleString() + " mg (about " + saltFromSodium(N.sodium.avg) + " g salt) — above the " + N.sodium.target.toLocaleString() + " mg limit on " + (D - N.sodium.met) + " of " + D + " days. Heavy sweating raises needs, but pickles, papad and restaurant food add up fast." });
    if (N.fiber.cov >= 0.6 && N.fiber.pct < 80) out.push({ level: "warn", text: "Fiber averaged " + Math.round(N.fiber.avg) + " g vs " + N.fiber.target + " g — extra sabji, dal or a fruit keeps you fuller on a deficit." });
    else if (N.fiber.cov >= 0.6 && N.fiber.pct >= 100) out.push({ level: "good", text: "Fiber averaged " + Math.round(N.fiber.avg) + " g a day, at or above your " + N.fiber.target + " g target." });
    Object.keys(stats.ulDays).forEach(k => {
      const fromSupp = N[k].avgSupp > N[k].avgFood;
      out.push({ level: "bad", text: nm(k) + " was above its upper limit on " + stats.ulDays[k] + " day" + (stats.ulDays[k] > 1 ? "s" : "") + (fromSupp ? ", mostly from supplements" : "") + ". Worth reviewing doses with a doctor if that's regular." });
    });
    const vb = stats.vegB12;
    if (vb.vegDays >= 2 && vb.vegAvg != null && vb.vegAvg < 1.2) out.push({ level: "warn", text: "On " + vb.vegDays + " days without meat, fish or eggs, logged B12 averaged " + fmtAmt(vb.vegAvg, "µg") + " (target 2.4). The Indian food tables don't list B12, so some may be missing data — dairy, eggs or a B12 supplement cover it." });
    if (stats.waterAvg != null && stats.waterAvg < stats.waterTarget * 0.8) out.push({ level: "warn", text: "Water averaged " + stats.waterAvg.toLocaleString() + " ml on logged days vs a " + stats.waterTarget.toLocaleString() + " ml target." });
    stats.supps.forEach(s => {
      if (s.pct >= 85) out.push({ level: "good", text: s.name + " taken on " + s.taken + " of " + s.of + " days." });
      else if (s.pct < 60) out.push({ level: "warn", text: s.name + " taken on only " + s.taken + " of " + s.of + " days — pairing it with a meal you never skip helps." });
    });
    const sp = stats.split;
    if (sp.train.n && sp.rest.n && sp.rest.protein < sp.train.protein * 0.85) out.push({ level: "warn", text: "Protein averaged " + sp.rest.protein + " g on rest days vs " + sp.train.protein + " g on training days — recovery needs it on rest days too." });
    return out;
  }

  /* ================= Status labels & gaps ================= */

  // A day is judged only once it's over (or after 10:30 pm today, once dinner is in); before that, labels read as progress.
  const DAY_COMPLETE_MINUTES = 22 * 60 + 30;
  const DAY_COMPLETE_LABEL = "10:30 pm";
  function isDayComplete(dateKey) {
    const t = todayKey();
    if (dateKey < t) return true;
    if (dateKey > t) return false;
    const now = new Date();
    return now.getHours() * 60 + now.getMinutes() >= DAY_COMPLETE_MINUTES;
  }
  const STATUS_STYLE = {
    low: { label: "Low", color: "var(--danger)" },
    under: { label: "Under", color: "var(--danger)" },

  function DietPlanUploadSheet({ open, onClose, data, setData }) {
    const [phase, setPhase] = useState("idle"); // idle | processing | review | error
    const [progressMsg, setProgressMsg] = useState("");
    const [errorMsg, setErrorMsg] = useState("");
    const [form, setForm] = useState(null);
    const toast = useToast();
    const fileRef = useRef();

    useEffect(() => {
      if (!open) return;
      if (data.dietPlan) {
        setForm({
          title: data.dietPlan.title || "My Diet Plan",
          calories: data.dietPlan.calories ?? "",
          protein: data.dietPlan.protein ?? "",
          meals: (data.dietPlan.meals || []).map(m => ({ slot: m.slot, text: (m.options || []).join("\n") })),
          rawText: data.dietPlan.rawText || "",
          thumbnails: data.dietPlan.thumbnails || []
        });
        setPhase("review");
      } else {
        setForm(null);
        setPhase("idle");
      }
      setErrorMsg("");
    }, [open]);

    const pickFile = () => { fileRef.current && fileRef.current.click(); };
    const onFileChosen = async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      setPhase("processing");
      setProgressMsg("Loading OCR engine (first time only, then cached)...");
      try {
        const { fullText, thumbnails } = await ocrFile(file, setProgressMsg);
        const parsed = parseDietPlanText(fullText);
        setForm({
          title: (file.name || "My Diet Plan").replace(/\.[^.]+$/, ""),
          calories: parsed.calories ?? "",
          protein: parsed.protein ?? "",
          meals: parsed.meals.map(m => ({ slot: m.slot, text: m.options.join("\n") })),
          rawText: fullText,
          thumbnails
        });
        setPhase("review");
        if (!parsed.calories && !parsed.protein && !parsed.meals.length) {
          toast("Couldn't auto-detect much — check the raw text below and fill in manually");
        }
      } catch (err) {
        setErrorMsg((err && err.message) || "Something went wrong reading that file. Try a clearer photo or a different file.");
        setPhase("error");
      }
    };

    const updateMeal = (i, patch) => setForm(s => ({ ...s, meals: s.meals.map((m, idx) => idx === i ? { ...m, ...patch } : m) }));
    const addMeal = () => setForm(s => ({ ...s, meals: [...s.meals, { slot: "New meal", text: "" }] }));
    const removeMeal = (i) => setForm(s => ({ ...s, meals: s.meals.filter((_, idx) => idx !== i) }));

    const save = () => {
      const calories = form.calories === "" ? null : clamp(form.calories, 800, 8000);
      const protein = form.protein === "" ? null : clamp(form.protein, 0, 600);
      const meals = form.meals
        .map(m => ({ slot: (m.slot || "").trim() || "Meal", options: (m.text || "").split("\n").map(s => s.trim()).filter(Boolean) }))
        .filter(m => m.options.length);
      const dietPlan = {
        title: (form.title || "").trim() || "My Diet Plan",
        calories, protein, meals,
        rawText: form.rawText || "",
        thumbnails: form.thumbnails || [],
        updatedAt: Date.now()
      };
      const nextProfile = { ...data.profile };
      if (calories != null) nextProfile.customCalories = calories;
      if (protein != null) nextProfile.customMacros = { ...(data.profile.customMacros || {}), protein };
      setData({ ...data, dietPlan, profile: nextProfile });
      toast("Diet plan saved — your daily targets are updated");
      onClose();
    };

    return h(Sheet, { open, onClose, title: "Diet plan" },
      phase === "idle" && h("div", null,
        h("div", { style: { fontSize: 13, color: "var(--muted)", marginBottom: 14 } },
          "Upload a PDF or photo of your diet plan. It's read entirely on this device using on-device OCR — nothing is uploaded anywhere. You'll review and can edit everything before it's saved."),
        h("input", { ref: fileRef, type: "file", accept: ".pdf,image/*", style: { display: "none" }, onChange: onFileChosen }),
        h("button", { className: "btn", onClick: pickFile }, Icon("upload", 18), h("span", { style: { marginLeft: 6 } }, "Choose PDF or photo"))
      ),
      phase === "processing" && h("div", { style: { textAlign: "center", padding: "34px 10px" } },
        h("div", { style: { fontSize: 32, marginBottom: 10 } }, "📄"),
        h("div", { style: { fontWeight: 600, marginBottom: 6 } }, "Reading your plan..."),
        h("div", { style: { fontSize: 12.5, color: "var(--muted)" } }, progressMsg || "Working...")
      ),
      phase === "error" && h("div", null,
        h("div", { style: { padding: 14, background: "var(--danger-soft)", color: "var(--danger)", borderRadius: 10, fontSize: 13, marginBottom: 12 } }, errorMsg),
        h("button", { className: "btn secondary", onClick: () => setPhase("idle") }, "Try again")
      ),
      phase === "review" && form && h("div", null,
        h("div", { className: "field" },
          h("label", null, "Plan title"),
          h("input", { className: "input", value: form.title, onChange: (e) => setForm(s => ({ ...s, title: e.target.value })) })
        ),
        h("div", { className: "field-row" },
          h("div", null, h("label", null, "Daily calories"),
            h("input", { className: "input", type: "number", inputMode: "numeric", value: form.calories, onChange: (e) => setForm(s => ({ ...s, calories: e.target.value })) })),
          h("div", null, h("label", null, "Daily protein (g)"),
            h("input", { className: "input", type: "number", inputMode: "numeric", value: form.protein, onChange: (e) => setForm(s => ({ ...s, protein: e.target.value })) }))
        ),
        h("div", { style: { fontSize: 11.5, color: "var(--muted)", margin: "6px 0 12px" } },
          "Carbs & fat auto-fill from these two numbers, same as your other daily targets."),
        h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6, marginBottom: 6 } },
          h("label", { style: { margin: 0 } }, "Meals"),
          h("button", { className: "icon-btn-sm", onClick: addMeal, "aria-label": "Add meal" }, Icon("plus", 16))
        ),
        form.meals.map((m, i) => h("div", { key: i, style: { background: "var(--card2)", borderRadius: 10, padding: 10, marginBottom: 8 } },
          h("div", { style: { display: "flex", gap: 6, marginBottom: 6 } },
            h("input", { className: "input", value: m.slot, onChange: (e) => updateMeal(i, { slot: e.target.value }), placeholder: "Meal name", style: { flex: 1 } }),
            h("button", { className: "icon-btn-sm danger", onClick: () => removeMeal(i), "aria-label": "Remove meal" }, Icon("close", 16))
          ),
          h("textarea", { className: "textarea", value: m.text, onChange: (e) => updateMeal(i, { text: e.target.value }), placeholder: "One option per line", style: { minHeight: 56 } })
        )),
        form.meals.length === 0 && h("div", { style: { fontSize: 12.5, color: "var(--muted)", padding: "8px 0" } },
          "No meals detected — add them manually above, or check the raw text below."),
        form.rawText && h("details", { className: "exp", style: { marginTop: 10 } },
          h("summary", null, "Raw extracted text (for reference)"),
          h("pre", { style: { whiteSpace: "pre-wrap", fontSize: 11, color: "var(--muted)", marginTop: 8, maxHeight: 180, overflowY: "auto", fontFamily: "inherit" } }, form.rawText)
        ),
        h("button", { className: "btn", onClick: save, style: { marginTop: 14 } }, "Save diet plan")
      )
    );
  }

  /* ---------- Add Meal sheet ---------- */
  function AddMealSheet({ open, onClose, data, setData, activeDate, slot }) {
    const [query, setQuery] = useState("");
    const [apiResults, setApiResults] = useState([]);
    const [apiLoading, setApiLoading] = useState(false);
    const [err, setErr] = useState(null);
    const [mode, setMode] = useState("search"); // search | scan | quick | manual
    const [manualMode, setManualMode] = useState("per100"); // per100 | recipe
    const [selected, setSelected] = useState(null); // food picked from search, awaiting weight confirm
    const [selectedCombo, setSelectedCombo] = useState(null); // saved meal picked from search
    const [grams, setGrams] = useState(100);
    const [oil, setOil] = useState("normal");
    const [quickText, setQuickText] = useState("");
    const [quickBusy, setQuickBusy] = useState(false);
    const [quickPreview, setQuickPreview] = useState(null); // [{ text, food, grams }]
    const [saveName, setSaveName] = useState(null); // non-null while naming a saved meal
    const toast = useToast();
    const inputRef = useRef();
    const recentFoods = useMemo(() => recentFoodsFrom(data.days, 10), [data.days, open]);
    const recentPool = useMemo(() => recentFoodsFrom(data.days, 60), [data.days, open]);
    const freq = useMemo(() => foodFrequency(data.days), [data.days, open]);
    const provId = data.providers.active;
    const onlineProv = provId !== "mock" ? PROVIDERS[provId] : null;
    const searchOpts = { customFoods: data.customFoods, savedMeals: data.savedMeals, recents: recentPool, freq };

    useEffect(() => {
      if (open) {
        setQuery("");
        setApiResults([]);
        setErr(null);
        setMode("search");
        setManualMode("per100");
        setSelected(null);
        setSelectedCombo(null);
        setQuickPreview(null);
        setSaveName(null);
        setTimeout(() => { try { inputRef.current && inputRef.current.focus(); } catch(e) {} }, 320);
      }
    }, [open]);

    // Local results are instant; they cover built-in foods, your saved foods, recents and saved meals.
    const localResults = useMemo(() => query.trim() ? searchLocal(query, searchOpts) : [],
      [query, data.customFoods, data.savedMeals, recentPool, freq]);

    // An online source (USDA / Nutritionix / Edamam), if one is set in Settings, adds extra results below.
    useEffect(() => {
      if (!open || !onlineProv) { setApiResults([]); return; }
      let cancelled = false;
      const q = query.trim();
      if (q.length < 2) { setApiResults([]); setErr(null); return; }
      const t = setTimeout(async () => {
        setApiLoading(true); setErr(null);
        try {
          const res = await onlineProv.search(q, data.providers[provId]);
          if (!cancelled) setApiResults(res || []);
        } catch(e) {
          if (!cancelled) { setErr(e.message || "Online search failed"); setApiResults([]); }
        } finally {
          if (!cancelled) setApiLoading(false);
        }
      }, 450);
      return () => { cancelled = true; clearTimeout(t); };
    }, [query, open, provId, data.providers]);

    const slotName = (MEAL_SLOTS.find(s => s.id === slot) || {}).name || "meal";
    const slotItemsToday = (((data.days || {})[activeDate] || {}).meals || []).filter(m => (m.slot || "snacks") === (slot || "snacks"));

    const selectFood = (food) => {
      if (food.type === "combo") { setSelectedCombo(food); return; }
      setSelected(food);
      // Edamam search results carry only 5 values — fetch the full nutrient panel in the background
      if (food.edamamFoodId && onlineProv && onlineProv.detail) {
        setSelected({ ...food, loadingDetail: true });
        onlineProv.detail(food, data.providers[provId])
          .then(full => setSelected(cur => cur && cur.id === food.id ? full : cur))
          .catch(() => setSelected(cur => cur && cur.id === food.id ? { ...food, edamamFoodId: null } : cur));
      }
      setOil(data.profile.oilLevel || "normal");
      setGrams(food.lastGrams || (food.units && food.units[0] ? food.units[0].g : foodBaseGrams(food)));
    };

    const oilLabel = (id) => id === "normal" ? "home-style oil" : id === "minimal" ? "minimal oil" : "restaurant oil";

    // Build a full meal entry from a (oil-applied) food object + logged grams.
    const mealFromFood = (food, weightGrams) => {
      const scaled = scaleFoodToWeight(food, weightGrams);
      return {
        id: uid(), slot: slot || "snacks", time: Date.now(), qty: 1,
        name: food.name, serving: weightGrams + "g" + (food.oilLevel ? " · " + oilLabel(food.oilLevel) : ""),
        grams: weightGrams, baseGrams: foodBaseGrams(food), baseNutrition: nutritionOf(food),
        units: food.units || [], cat: food.cat || null, src: food.src || null, oilLevel: food.oilLevel || null,
        ...scaled
      };
    };
    const mealFromFoodLinked = (food, w) => applyMicroLink(data, mealFromFood(food, w));

    const commit = (food, weightGrams) => {
      const next = { ...data };
      const d = ensureDay(next.days, activeDate);
      d.meals.push(mealFromFoodLinked(applyOil(food, oil), weightGrams));
      if (food.oilG && oil !== data.profile.oilLevel) next.profile = { ...data.profile, oilLevel: oil }; // remember last choice
      setData(next);
      toast("Added " + food.name);
      onClose();
    };

    // Manual / recipe entries already come pre-scaled to the logged weight — add as-is.
    // foodForDb (optional) is saved to the food database in the SAME setData call as the meal push,
    // since two separate setData calls in one handler would otherwise race on the stale `data` closure.
    const pickManual = (food, foodForDb) => {
      const next = { ...data };
      const d = ensureDay(next.days, activeDate);
      d.meals.push({ id: uid(), slot: slot || "snacks", time: Date.now(), qty: 1, ...food });
      if (foodForDb) {
        next.customFoods = [...(next.customFoods || []), { ...foodForDb, id: "custom-" + uid() }];
      }
      setData(next);
      toast("Added " + food.name);
      onClose();
    };

    // Copy every item from yesterday's same slot into today.
    const copyYesterday = () => {
      const y = shift(activeDate, -1);
      const yMeals = (((data.days || {})[y] || {}).meals || []).filter(m => (m.slot || "snacks") === (slot || "snacks"));
      if (!yMeals.length) { toast("Nothing in yesterday's " + slotName.toLowerCase()); return; }
      const next = { ...data };
      const d = ensureDay(next.days, activeDate);
      yMeals.forEach(m => d.meals.push({ ...m, id: uid(), time: Date.now() }));
      setData(next);
      toast("Copied " + yMeals.length + " item" + (yMeals.length > 1 ? "s" : "") + " from yesterday");
      onClose();
    };

    /* ---- Saved meals ---- */
    const saveSlotAsMeal = () => {
      const name = (saveName || "").trim();
      if (!name || !slotItemsToday.length) return;
      const items = slotItemsToday.map(({ id, time, slot: _s, ...rest }) => rest);
      setData({ ...data, savedMeals: [...(data.savedMeals || []), { id: uid(), name, items }] });
      setSaveName(null);
      toast("Saved \"" + name + "\"");
    };
    const addCombo = (combo) => {
      const next = { ...data };
      const d = ensureDay(next.days, activeDate);
      (combo.items || []).forEach(it => d.meals.push(applyMicroLink(data, { ...it, id: uid(), time: Date.now(), slot: slot || "snacks" })));
      setData(next);
      toast("Added " + combo.name);
      onClose();
    };
    const deleteCombo = (combo) => {
      if (!confirm("Delete saved meal \"" + combo.name + "\"?")) return;
      setData({ ...data, savedMeals: (data.savedMeals || []).filter(m => m.id !== combo.id) });
      setSelectedCombo(null);
    };
    const comboKcal = (c) => Math.round((c.items || []).reduce((s, it) => s + (it.calories || 0) * (it.qty || 1), 0));

    /* ---- Quick add ---- */
    const runQuickAdd = async () => {
      const text = quickText.trim();
      if (!text) return;
      if (provId === "nutritionix") {
        // Nutritionix parses the whole phrase (works for non-Indian foods too).
        setQuickBusy(true);
        try {
          const res = await PROVIDERS.nutritionix.search(text, data.providers.nutritionix);
          setQuickPreview((res || []).map(f => ({ text: f.name, food: f, grams: foodBaseGrams(f) })));
        } catch (e) { toast((e && e.message) || "Quick add failed"); }
        finally { setQuickBusy(false); }
        return;
      }
      setQuickPreview(parseQuickText(text, searchOpts));
    };
    const addQuickPreview = () => {
      const picks = (quickPreview || []).filter(p => p.food && Number(p.grams) > 0);
      if (!picks.length) return;
      const next = { ...data };
      const d = ensureDay(next.days, activeDate);
      const lvl = data.profile.oilLevel || "normal";
      picks.forEach(p => d.meals.push(mealFromFoodLinked(applyOil(p.food, lvl), Number(p.grams))));
      setData(next);
      toast("Added " + picks.length + " item" + (picks.length > 1 ? "s" : ""));
      onClose();
    };

    /* ---- Row renderers ---- */
    const macroLine = (f) => "P" + Math.round(f.protein || 0) + " C" + Math.round(f.carbs || 0) + " F" + Math.round(f.fat || 0);
    const foodRow = (f, key) => f.type === "combo"
      ? h("div", { key, className: "search-item", onClick: () => selectFood(f) },
          h("div", { style: { flex: 1, minWidth: 0 } },
            h("div", { className: "nm" }, f.name),
            h("div", { className: "sv" }, "Saved meal · " + (f.items || []).length + " items")),
          h("div", { className: "cal" }, comboKcal(f) + " kcal"))
      : h("div", { key, className: "search-item", onClick: () => selectFood(f) },
          h("div", { style: { flex: 1, minWidth: 0 } },
            h("div", { className: "nm" }, f.name),
            h("div", { className: "sv" },
              (f.units && f.units[0] ? f.units[0].label + " (" + f.units[0].g + "g)" : (f.serving || foodBaseGrams(f) + "g")) +
              " · " + macroLine(f) + (SRC_LABEL[f.src] && f.src !== "builtin" ? " · " + SRC_LABEL[f.src] : ""))),
          h("div", { className: "cal" }, Math.round(f.calories || 0) + " kcal"));
    const sectionLabel = (t) => h("div", { style: { fontSize: 12, color: "var(--muted)", margin: "10px 0 6px", fontWeight: 600 } }, t);
    const chip = (label, active, onClick, key) => h("button", {
      key: key || label, className: "pill", onClick,
      style: { border: active ? "1px solid var(--primary)" : "1px solid transparent", cursor: "pointer", padding: "6px 10px",
               color: active ? "var(--primary)" : undefined }
    }, label);

    const effective = selected ? applyOil(selected, oil) : null;
    const preview = effective ? scaleFoodToWeight(effective, grams) : null;
    const extraLine = (n) => {
      const parts = [];
      if (n.fiber != null) parts.push("Fiber " + n.fiber + "g");
      if (n.sugar != null) parts.push("Sugar " + n.sugar + "g");
      if (n.sodium != null) parts.push("Sodium " + n.sodium + "mg");
      return parts.join(" · ");
    };

    const seg = h("div", { className: "seg" },
      h("button", { className: mode === "search" ? "active" : "", onClick: () => { setMode("search"); setSelected(null); setSelectedCombo(null); } }, "Search"),
      h("button", { className: mode === "scan" ? "active" : "", onClick: () => { setMode("scan"); setSelected(null); } }, "Scan"),
      h("button", { className: mode === "quick" ? "active" : "", onClick: () => setMode("quick") }, "Quick add"),
      h("button", { className: mode === "manual" ? "active" : "", onClick: () => setMode("manual") }, "Manual")
    );

    let body;
    if (mode === "quick") {
      body = h("div", null,
        h("div", { className: "field" },
          h("label", null, "Describe what you ate"),
          h("textarea", {
            className: "input", style: { minHeight: 84, resize: "vertical" },
            placeholder: "e.g. 2 phulka, 1 katori bhindi sabji, dal and a banana",
            value: quickText, onChange: (e) => { setQuickText(e.target.value); setQuickPreview(null); }, autoCapitalize: "none"
          })
        ),
        h("div", { style: { fontSize: 11.5, color: "var(--muted)", marginBottom: 10 } },
          provId === "nutritionix"
            ? "Nutritionix parses the whole phrase. Review the items before adding."
            : "Works offline. Understands numbers, katori, glass, tbsp, grams and Indian food names. Review the items before adding."),
        !quickPreview && h("button", { className: "btn", disabled: quickBusy || !quickText.trim(), onClick: runQuickAdd }, quickBusy ? "Matching…" : "Find foods"),
        quickPreview && h("div", null,
          quickPreview.map((p, i) => p.food
            ? h("div", { key: i, className: "search-item", style: { cursor: "default", gap: 8 } },
                h("div", { style: { flex: 1, minWidth: 0 } },
                  h("div", { className: "nm" }, p.food.name),
                  h("div", { className: "sv" }, "from \u201c" + p.text + "\u201d")),
                h("input", { className: "input", type: "number", inputMode: "decimal", value: p.grams, style: { width: 72, padding: "6px 8px" },
                  "aria-label": "Grams for " + p.food.name,
                  onChange: (e) => { const v = e.target.value === "" ? "" : Number(e.target.value); setQuickPreview(qp => qp.map((x, j) => j === i ? { ...x, grams: v } : x)); } }),

  // Live barcode scanning via the BarcodeDetector API (Chrome/Android). Falls back to manual
  // barcode entry where unsupported (e.g. iOS Safari). Looks products up on Open Food Facts.
  // lookupFn(code) -> result object to pass to onFound, or null when nothing was found.
  function BarcodeScanner({ onFound, lookupFn, footnote }) {
    const supported = typeof window !== "undefined" && "BarcodeDetector" in window;
    const [status, setStatus] = useState(supported ? "starting" : "unsupported"); // starting|scanning|denied|nocam|unsupported|notfound|error
